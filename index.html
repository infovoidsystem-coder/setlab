<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SetLab"/>
<title>SetLab — DJ Set Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;--gold2:#7a6230;
  --bg:#030302;--bg2:#080808;--bg3:#0f0e0c;
  --border:#1c1a17;--border2:#252320;
  --text:#e8e2d9;--text2:#a09890;--text3:#706860;--text4:#403c38;
  --green:#22c55e;--lime:#84cc16;--yellow:#eab308;--orange:#f97316;--red:#ef4444;
  --sans:'Syne',sans-serif;--mono:'DM Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input{font-family:var(--mono);outline:none;border:none}
::-webkit-scrollbar{display:none}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{
  padding-top:var(--safe-top);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;
  z-index:10;
}
#header-inner{height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}
#logo{display:flex;align-items:center;gap:8px;flex:1}
#logo-text{font-size:18px;font-weight:800;letter-spacing:-0.5px;color:var(--gold)}
#logo-sub{font-family:var(--mono);font-size:7px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-top:1px}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#nav{
  padding-bottom:var(--safe-bot);
  background:rgba(4,3,2,0.97);
  border-top:1px solid var(--border);
  flex-shrink:0;
  display:flex;
  position:relative;
  z-index:10;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:10px 0;
  border:none;background:none;position:relative;
}
.nav-label{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text4);font-weight:600}
.nav-btn.active .nav-label{color:var(--gold)}
.nav-dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:18px;height:2px;background:var(--gold);border-radius:0 0 2px 2px;opacity:0}
.nav-btn.active .nav-dot{opacity:1}
.nav-badge{position:absolute;top:5px;right:calc(50% - 18px);background:var(--gold);color:#000;font-size:7px;font-weight:800;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* SCREENS */
.screen{display:none;padding:16px;max-width:480px;margin:0 auto;min-height:100%}
.screen.active{display:block}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card-title{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}

/* TRACK CARD */
.track-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
  transition:border-color 0.15s;
}
.track-card.selected{border-color:var(--gold);background:var(--bg3)}
.track-card.in-set{border-color:#22c55e44}
.track-info{flex:1;min-width:0}
.track-title{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:11px;color:var(--text3);margin-top:2px}
.track-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
.key-pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid;font-weight:500}
.bpm-tag{font-family:var(--mono);font-size:9px;color:var(--text3)}
.energy-dots{display:flex;gap:2px;align-items:center}
.energy-dot{width:4px;height:4px;border-radius:50%;background:var(--border2)}
.energy-dot.on{background:var(--gold)}

/* BUTTONS */
.btn-add{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--border2);color:var(--text3);
  font-size:18px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.15s;
}
.btn-add.added{border-color:#22c55e44;color:#22c55e;background:#22c55e11}
.btn-remove{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--red)33;color:var(--red);
  font-size:14px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;opacity:0.7;
}

/* SEARCH */
.search-box{
  width:100%;background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px;padding:10px 14px;color:var(--text);font-size:13px;
  margin-bottom:12px;
}
.search-box::placeholder{color:var(--text3)}

/* FILTERS */
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
.filter-chip{
  font-family:var(--mono);font-size:9px;white-space:nowrap;
  padding:5px 10px;border-radius:20px;border:1px solid var(--border2);
  color:var(--text3);transition:all 0.15s;flex-shrink:0;
}
.filter-chip.active{border-color:var(--gold);color:var(--gold);background:#c9a84c11}

/* SECTION HEADERS */
.section-header{
  font-family:var(--mono);font-size:8px;letter-spacing:2px;
  text-transform:uppercase;color:var(--text3);
  margin:16px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-header::after{content:'';flex:1;height:1px;background:var(--border)}

/* SET ITEM */
.set-item{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
}
.set-num{font-family:var(--mono);font-size:10px;color:var(--text4);width:20px;text-align:center;flex-shrink:0}
.set-info{flex:1;min-width:0}
.set-title{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-artist{font-size:10px;color:var(--text3)}
.compat-badge{
  font-family:var(--mono);font-size:8px;padding:3px 8px;
  border-radius:20px;border:1px solid;flex-shrink:0;
}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px}
.stat-val{font-size:24px;font-weight:800;color:var(--gold)}
.stat-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:0.5}
.empty-text{font-size:13px;line-height:1.6}

/* COMPAT CONNECTOR */
.compat-row{display:flex;align-items:center;gap:6px;margin:4px 0;padding:0 4px}
.compat-line{flex:1;height:1px;background:var(--border)}
.compat-label{font-family:var(--mono);font-size:8px;padding:2px 8px;border-radius:10px;border:1px solid;flex-shrink:0}

/* BUILD SCREEN */
.seed-card{
  background:var(--bg3);border:1px solid var(--gold)33;
  border-radius:16px;padding:14px 16px;margin-bottom:12px;
}
.seed-label{font-family:var(--mono);font-size:8px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.seed-title{font-size:16px;font-weight:800;color:var(--gold)}
.seed-artist{font-size:11px;color:var(--text2);margin-top:2px}

/* BUILD SUGGESTIONS */
.suggestion{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
}
.score-bar{height:3px;border-radius:2px;background:var(--border2);margin-top:6px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;background:var(--gold);transition:width 0.3s}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  z-index:100;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:20px 20px 0 0;padding:20px 20px 32px;
  width:100%;max-height:80vh;overflow-y:auto;
  transform:translateY(100%);transition:transform 0.3s;
}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px}
.modal-artist{font-size:11px;color:var(--text3);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;font-size:20px;color:var(--text3);padding:4px 8px}
.link-btn{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:12px;
  border:1px solid var(--border2);margin-bottom:8px;
  text-decoration:none;color:var(--text);
}
.link-btn:active{background:var(--bg3)}
.link-icon{font-size:16px;width:24px;text-align:center}
.link-label{font-size:13px;font-weight:600}
.link-sub{font-size:10px;color:var(--text3)}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.track-card,.set-item,.suggestion{animation:fadeIn 0.2s ease both}
</style>
</head>

</div>

// ─────────────────────────────────────────────
// LOGIC
// ─────────────────────────────────────────────
function camelotScore(a, b) {
  var nA=parseInt(a), nB=parseInt(b), lA=a.slice(-1), lB=b.slice(-1);
  if(nA===nB && lA===lB) return 100;
  if(nA===nB) return 75;
  var d=Math.min(Math.abs(nA-nB), 12-Math.abs(nA-nB));
  if(d===1 && lA===lB) return 90;
  if(d===1 && lA!==lB) return 50;
  if(d===2 && lA===lB) return 30;
  if(d===2 && lA!==lB) return 15;
  if(d===3) return 8;
  return 3;
}

function styleCompatScore(stylesA, stylesB) {
  for(var s of stylesA) if(stylesB.includes(s)) return 45;
  for(var s of stylesA) {
    var fA = STYLE_FAMILY[s] || [s];
    for(var t of stylesB) {
      var fB = STYLE_FAMILY[t] || [t];
      if(fA.some(function(f){return fB.includes(f);})) return 30;
    }
  }
  return 10;
}

function scoreMatch(seed, t) {
  var d = Math.abs(seed.bpm - t.bpm);
  var bpmScore = d===0?100:d<=2?95:d<=4?85:d<=7?65:d<=12?35:d<=15?10:0;
  var keyScore = camelotScore(seed.key, t.key);
  var eDiff = t.energy - seed.energy;
  var energyScore = eDiff===0?90:eDiff===1?100:eDiff===-1?80:eDiff===2?70:eDiff===-2?60:eDiff===3?50:eDiff===-3?30:10;
  var styleScore = styleCompatScore(seed.style, t.style);
  if(bpmScore===0) return {total:0,bpmScore,keyScore,energyScore,styleScore};
  var total = bpmScore + keyScore + energyScore + styleScore;
  return {total,bpmScore,keyScore,energyScore,styleScore};
}

function keyCompatLabel(a, b) {
  var s = camelotScore(a, b);
  if(s===100) return {label:'PERFECTO', color:'var(--green)'};
  if(s>=90)   return {label:'ARMÓNICO', color:'var(--lime)'};
  if(s>=75)   return {label:'MODAL',    color:'var(--yellow)'};
  if(s>=50)   return {label:'TENSIÓN',  color:'var(--orange)'};
  if(s>=15)   return {label:'SALTO',    color:'var(--orange)'};
  return             {label:'CHOQUE',   color:'var(--red)'};
}

function getKeyColor(k) {
  var n = parseInt(k);
  var l = k.slice(-1);
  var colors = ['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#a855f7','#ec4899'];
  return colors[(n-1) % 12];
}

function autoBuild(seed) {
  var pool = TRACKS.filter(function(t){ return t.id !== seed.id; });
  var sequence = [seed];
  var used = new Set([seed.id]);
  for(var step = 0; step < 7; step++) {
    var last = sequence[sequence.length-1];
    var scored = pool
      .filter(function(t){ return !used.has(t.id); })
      .map(function(t){
        var sc = scoreMatch(last, t);
        var drift = Math.abs(t.bpm - seed.bpm);
        var driftPen = drift > 18 ? -60 : drift > 12 ? -25 : drift > 8 ? -10 : 0;
        return {t, total: sc.total + driftPen};
      })
      .filter(function(x){ return x.total > 0; })
      .sort(function(a,b){ return b.total - a.total; });
    if(!scored.length) break;
    // pick from top 3 with some variety
    var pick = scored[Math.min(Math.floor(Math.random()*2), scored.length-1)];
    sequence.push(pick.t);
    used.add(pick.t.id);
  }
  return sequence.slice(1); // return without seed
}

function matchesStyle(t, filter) {
  if(filter === 'all') return true;
  return t.style.some(function(s){ return s === filter || (STYLE_FAMILY[filter]||[]).includes(s); });
}

// ─────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────
function keyPillHTML(k) {
  var c = getKeyColor(k);
  return '<span class="key-pill" style="color:'+c+';border-color:'+c+'44">'+k+'</span>';
}

function energyDotsHTML(e) {
  var html = '<div class="energy-dots">';
  for(var i=1;i<=10;i++) html += '<div class="energy-dot'+(i<=e?' on':'')+'"></div>';
  html += '</div>';
  return html;
}

function inSet(id) {
  return state.mySet.some(function(t){ return t.id===id; });
}

function trackCardHTML(track, opts) {
  opts = opts || {};
  var selected = state.seed && state.seed.id === track.id;
  var added = inSet(track.id);
  var cls = 'track-card' + (selected?' selected':'') + (added?' in-set':'');
  var scoreHtml = '';
  if(opts.score !== undefined) {
    var pct = Math.min(100, Math.round(opts.score.total / 3.5));
    scoreHtml = '<div class="score-bar"><div class="score-fill" style="width:'+pct+'%"></div></div>';
  }
  var compatHtml = '';
  if(opts.compat) {
    var c = keyCompatLabel(opts.compat.from, track.key);
    compatHtml = '<span class="compat-badge" style="color:'+c.color+';border-color:'+c.color+'44">'+c.label+'</span>';
  }
  return '<div class="'+cls+'" data-id="'+track.id+'" style="animation-delay:'+((opts.idx||0)*0.04)+'s">'
    + '<div class="track-info" onclick="onTrackClick('+track.id+')">'
    + '<div class="track-title">'+track.title+'</div>'
    + '<div class="track-artist">'+track.artist+'</div>'
    + '<div class="track-meta">'
    + keyPillHTML(track.key)
    + '<span class="bpm-tag">'+track.bpm+' BPM</span>'
    + energyDotsHTML(track.energy)
    + compatHtml
    + '</div>'
    + scoreHtml
    + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:4px;align-items:center;flex-shrink:0">'
    + '<button class="btn-add'+(added?' added':'')+'" onclick="toggleSet('+track.id+')" title="'+(added?'Quitar':'Agregar')+'">'+(added?'✓':'+')+'</button>'
    + '<button onclick="openFind('+track.id+')" style="font-size:9px;color:var(--text3);padding:2px 4px;letter-spacing:0.5px">🔗</button>'
    + '</div>'
    + '</div>';
}

// SCREENS

function renderLibrary() {
  var q = state.search.toLowerCase();
  var filtered = TRACKS.filter(function(t){
    var matchSearch = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
    var matchStyle = matchesStyle(t, state.styleFilter);
    return matchSearch && matchStyle;
  });

  var html = '';
  filtered.forEach(function(t, i){ html += trackCardHTML(t, {idx:i}); });
  if(!html) html = '<div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">No hay tracks que coincidan</div></div>';
  document.getElementById('library-list').innerHTML = html;
}

function renderStyleFilters() {
  var styles = ['all','techno','deep techno','industrial techno','hard techno','dub techno','ambient techno','melodic techno','dark house','deep house','melodic house','chicago','minimal','detroit','rave','dubstep','trip-hop'];
  var html = styles.map(function(s){
    return '<button class="filter-chip'+(state.styleFilter===s?' active':'')+'" onclick="setStyleFilter(\''+s+'\')">'+s+'</button>';
  }).join('');
  document.getElementById('style-filters').innerHTML = html;
}

  var el = document.getElementById('build-content');
  if(!state.seed) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🌱</div><div class="empty-text">Seleccioná un track en Library como semilla para construir tu set</div></div>';

  var seed = state.seed;

    + '<span class="bpm-tag">'+seed.bpm+' BPM</span>'
    + energyDotsHTML(seed.energy)
    + '</div>'
    + '</div>';

  // Action buttons
  html += '<div style="display:flex;gap:8px;margin-bottom:16px">'
    + '<button onclick="buildAutoSet()" style="flex:1;padding:10px;border-radius:12px;border:1px solid var(--gold)33;color:var(--gold);font-family:var(--sans);font-weight:700;font-size:11px;background:var(--gold)11">⚡ Auto-Build Set</button>'
    + '<button onclick="addSetToMain()" style="flex:1;padding:10px;border-radius:12px;border:1px solid var(--green)33;color:var(--green);font-family:var(--sans);font-weight:700;font-size:11px;background:var(--green)11">＋ Agregar todo</button>'
    + '</div>';

  // Suggestions
  if(suggs.length) {
    html += '<div class="section-header">Tracks compatibles</div>';
    suggs.forEach(function(item, i){
      var t = item.track;
      var sc = item.score;
      var added = inSet(t.id);
      var c = keyCompatLabel(seed.key, t.key);
      html += '<div class="suggestion" style="animation-delay:'+(i*0.05)+'s">'
        + '<div style="flex:1;min-width:0;cursor:pointer" onclick="onTrackClick('+t.id+')">'
        + '<div style="font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+t.title+'</div>'
        + '<div style="font-size:10px;color:var(--text3)">'+t.artist+'</div>'
        + '<div class="track-meta" style="margin-top:4px">'
        + keyPillHTML(t.key)
        + '<span class="bpm-tag">'+t.bpm+' BPM</span>'
        + '<span class="compat-badge" style="color:'+c.color+';border-color:'+c.color+'44">'+c.label+'</span>'
        + '</div>'
        + '<div class="score-bar"><div class="score-fill" style="width:'+Math.min(100,Math.round(sc.total/3.5))+'%"></div></div>'
        + '</div>'
        + '<button class="btn-add'+(added?' added':'')+'" onclick="toggleSet('+t.id+')">'+(added?'✓':'+')+'</button>'
        + '</div>';
    });
  } else {
    html += '<div class="empty"><div class="empty-text">Tocá "Auto-Build Set" para generar sugerencias</div></div>';
  }

  el.innerHTML = html;
}

function renderSet() {
  var el = document.getElementById('set-content');
  if(!state.mySet.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🎚️</div><div class="empty-text">Tu set está vacío.<br>Agregá tracks desde Library o Build.</div></div>';
    return;
  }

  // Stats
  var bpms = state.mySet.map(function(t){return t.bpm;});
  var minBpm = Math.min.apply(null,bpms), maxBpm = Math.max.apply(null,bpms);
  var avgEnergy = Math.round(state.mySet.reduce(function(a,t){return a+t.energy;},0)/state.mySet.length*10)/10;

  var html = '<div class="stat-grid">'
    + '<div class="stat-card"><div class="stat-val">'+state.mySet.length+'</div><div class="stat-lbl">Tracks</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="font-size:16px">'+minBpm+'–'+maxBpm+'</div><div class="stat-lbl">BPM Range</div></div>'
    + '</div>';

  html += '<div style="display:flex;gap:8px;margin-bottom:12px">'
    + '<button onclick="clearSet()" style="flex:1;padding:9px;border-radius:10px;border:1px solid var(--red)33;color:var(--red);font-size:11px;font-family:var(--sans);font-weight:700">🗑 Vaciar set</button>'
    + '</div>';

  html += '<div class="section-header">Tracks ('+state.mySet.length+')</div>';
  state.mySet.forEach(function(t, i){
    var prev = i > 0 ? state.mySet[i-1] : null;
    var compat = prev ? keyCompatLabel(prev.key, t.key) : null;

    if(compat) {
      html += '<div class="compat-row">'
        + '<div class="compat-line"></div>'
        + '<div class="compat-label" style="color:'+compat.color+';border-color:'+compat.color+'44">'+compat.label+'</div>'
        + '<div class="compat-line"></div>'
        + '</div>';
    }

    html += '<div class="set-item">'
      + '<span class="set-num">'+(i+1)+'</span>'
      + '<div class="set-info">'
      + '<div class="set-title">'+t.title+'</div>'
      + '<div class="set-artist">'+t.artist+'</div>'
      + '<div class="track-meta" style="margin-top:3px">'+keyPillHTML(t.key)+'<span class="bpm-tag">'+t.bpm+' BPM</span>'+energyDotsHTML(t.energy)+'</div>'
      + '</div>'
      + '<button class="btn-remove" onclick="removeFromSet('+t.id+')" title="Quitar">−</button>'
      + '</div>';
  });

  el.innerHTML = html;
}

function renderModal() {
  var t = state.findTrack;
  if(!t) return;
  var bpUrl = 'https://www.beatport.com/search?q='+encodeURIComponent(t.title+' '+t.artist);
  var spUrl = 'https://open.spotify.com/search/'+encodeURIComponent(t.title+' '+t.artist);
  var ytUrl = 'https://www.youtube.com/results?search_query='+encodeURIComponent(t.title+' '+t.artist);
  var raUrl = 'https://www.residentadvisor.net/search/?q='+encodeURIComponent(t.title+' '+t.artist)+'&section=tracks';

  var html = '<div class="modal-title">'+t.title+'</div>'
    + '<div class="modal-artist">'+t.artist+' · '+t.label+'</div>'
    + '<div class="track-meta" style="margin-bottom:16px">'+keyPillHTML(t.key)+'<span class="bpm-tag">'+t.bpm+' BPM</span>'+energyDotsHTML(t.energy)+'</div>'
    + '<a href="'+bpUrl+'" target="_blank" class="link-btn">'
    + '<span class="link-icon">🎵</span>'
    + '<div><div class="link-label">Beatport</div><div class="link-sub">Comprar / escuchar</div></div>'
    + '</a>'
    + '<a href="'+spUrl+'" target="_blank" class="link-btn">'
    + '<span class="link-icon">💚</span>'
    + '<div><div class="link-label">Spotify</div><div class="link-sub">Escuchar</div></div>'
    + '</a>'
    + '<a href="'+ytUrl+'" target="_blank" class="link-btn">'
    + '<span class="link-icon">▶️</span>'
    + '<div><div class="link-label">YouTube</div><div class="link-sub">Ver video</div></div>'
    + '</a>'
    + '<a href="'+raUrl+'" target="_blank" class="link-btn">'
    + '<span class="link-icon">📻</span>'
    + '<div><div class="link-label">Resident Advisor</div><div class="link-sub">Info del track</div></div>'
    + '</a>';

  document.getElementById('modal-content').innerHTML = html;
}

// ─────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
  if(tab === 'build') renderBuild();
  if(tab === 'set') renderSet();
  // scroll content to top
  document.getElementById('content').scrollTop = 0;
}

function onTrackClick(id) {
  var t = TRACKS.find(function(x){ return x.id===id; });
  if(!t) return;
  if(state.seed && state.seed.id === id) {
    state.seed = null;
    state.suggestions = [];
  } else {
    state.seed = t;
    // Auto-generate suggestions immediately
    var pool = TRACKS.filter(function(x){ return x.id !== id; });
    var scored = pool.map(function(x){
      return {track:x, score:scoreMatch(t, x)};
    }).filter(function(x){ return x.score.total > 0; })
      .sort(function(a,b){ return b.score.total - a.score.total; });
    state.suggestions = scored.slice(0, 20);
    switchTab('build');
  }
  renderLibrary();
}

function toggleSet(id) {
  var t = TRACKS.find(function(x){ return x.id===id; });
  if(!t) return;
  if(inSet(id)) {
    state.mySet = state.mySet.filter(function(x){ return x.id!==id; });
  } else {
    state.mySet.push(t);
  }
  updateBadge();
  // Re-render current screen
  if(state.tab === 'library') renderLibrary();
  if(state.tab === 'build') renderBuild();
  if(state.tab === 'set') renderSet();
}

function removeFromSet(id) {
  state.mySet = state.mySet.filter(function(x){ return x.id!==id; });
  updateBadge();
  renderSet();
}

function clearSet() {
  state.mySet = [];
  updateBadge();
  renderSet();
}

function updateBadge() {
  var badge = document.getElementById('set-badge');
  if(state.mySet.length > 0) {
    badge.textContent = state.mySet.length;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function buildAutoSet() {
  if(!state.seed) return;
  var built = autoBuild(state.seed);
  // Add seed + built to set
  state.mySet = [state.seed];
  built.forEach(function(t){
    if(!inSet(t.id)) state.mySet.push(t);
  });
  updateBadge();
  renderBuild();
}

function addSetToMain() {
  if(!state.seed) return;
  if(!inSet(state.seed.id)) state.mySet.unshift(state.seed);
  state.suggestions.forEach(function(item){
    if(!inSet(item.track.id)) state.mySet.push(item.track);
  });
  updateBadge();
  switchTab('set');
}

function setStyleFilter(s) {
  state.styleFilter = s;
  renderStyleFilters();
  renderLibrary();
}

function openFind(id) {
  var t = TRACKS.find(function(x){ return x.id===id; });
  if(!t) return;
  state.findTrack = t;
  renderModal();
  document.getElementById('find-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('find-modal').classList.remove('open');
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function(e) {
  state.search = e.target.value;
  renderLibrary();
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderStyleFilters();
renderLibrary();
</script>
</body>
