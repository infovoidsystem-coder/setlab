  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#030302;font-family:'Syne',sans-serif;transition:background 0.3s}

  input[type=range]{-webkit-appearance:none;height:1.5px;border-radius:1px;background:#161412;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#c9a84c;cursor:pointer;box-shadow:0 0 0 3px #c9a84c18}
  body.light input[type=range]{background:#d8d4ce}
  body.light input[type=range]::-webkit-slider-thumb{background:#9a7030;box-shadow:0 0 0 3px #9a703022}
  select option{background:#1a1814;color:#e8e2d9}
  body.light select option{background:#ffffff;color:#1c1a17}

  /* ── Inputs del formulario DJs ── */
  .sl-input {
    width:100%; border-radius:10px; padding:11px 13px;
    font-family:'Syne',sans-serif; font-size:13px; outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sl-input:focus { box-shadow: 0 0 0 2px #a855f730; }
  body:not(.light) .sl-input {
    background:#1c1914; border:1px solid #2e2c28;
    color:#e8e2d9;
  }
  body:not(.light) .sl-input::placeholder { color:#706860; }
  body:not(.light) .sl-input:focus { border-color:#a855f766; background:#201d18; }
  body.light .sl-input {
    background:#f8f6f2; border:1px solid #d4cfc8;
    color:#1c1a17;
  }
  body.light .sl-input::placeholder { color:#a0998f; }
  body.light .sl-input:focus { border-color:#a855f766; background:#ffffff; }

  .sl-select {
    width:100%; border-radius:10px; padding:11px 13px;
    font-family:'DM Mono',monospace; font-size:13px; outline:none; cursor:pointer;
    transition: border-color 0.2s;
    -webkit-appearance:none; appearance:none;

  }

    background-color:#1c1914; border:1px solid #2e2c28; color:#e8e2d9;
  }

  body.light .sl-select {
    background-color:#f8f6f2; border:1px solid #d4cfc8; color:#1c1a17;
  }
  body.light .sl-select:focus { border-color:#a855f766; }
  body.light .sl-select option { background:#ffffff; color:#1c1a17; }

const T = { ...DARK_T };
function applyTheme(name) {
  const src = name === "light" ? LIGHT_T : DARK_T;
  Object.assign(T, src);
  document.body.style.background = T.bg;
  document.body.className = name === "light" ? "light" : "";
  try { localStorage.setItem("setlab_theme", name); } catch {}
}

function camelotScore(a, b) {
  const nA=parseInt(a), nB=parseInt(b), lA=a.slice(-1), lB=b.slice(-1);
  if(nA===nB&&lA===lB) return 100; // mismo — perfecto
  if(nA===nB) return 75;           // relativo mayor/menor
  const d=Math.min(Math.abs(nA-nB),12-Math.abs(nA-nB));
  if(d===1&&lA===lB) return 90;   // adyacente mismo modo
  if(d===1&&lA!==lB) return 50;   // adyacente cruzado
  if(d===2&&lA===lB) return 30;   // salto de 2 mismo modo
  if(d===2&&lA!==lB) return 15;   // salto de 2 cruzado
  if(d===3&&lA===lB) return 10;   // salto de 3 — arriesgado
  if(d===3&&lA!==lB) return 5;
  return 2;                        // > 3 — muy arriesgado pero no cero (no bloquear autobuild)
}
// styleCompatScore: calcula compatibilidad de estilos usando STYLE_FAMILY
function styleCompatScore(stylesA, stylesB) {
  // Match directo
  for (const s of stylesA) {
    if (stylesB.includes(s)) return 45;
  }
  // Match por familia de estilos
  for (const s of stylesA) {
    const familyA = STYLE_FAMILY[s] || [s];
    for (const t of stylesB) {
      const familyB = STYLE_FAMILY[t] || [t];
      if (familyA.some(f => familyB.includes(f))) return 30;
    }
  }
  return 10;
}

// scoreMatch: solo bloquea si BPM completamente incompatible (>16 BPM de diferencia)
function scoreMatch(seed, t) {
  const d = Math.abs(seed.bpm - t.bpm);
  const bpmScore = d===0?100:d<=2?95:d<=4?85:d<=7?65:d<=12?35:d<=15?10:0;
  const keyScore = camelotScore(seed.key, t.key); // nunca 0
  const eDiff = t.energy - seed.energy;
  const energyScore = eDiff===0?90:eDiff===1?100:eDiff===-1?80:eDiff===2?70:eDiff===-2?60:eDiff===3?50:eDiff===-3?30:10;
  const styleScore = styleCompatScore(seed.style, t.style);
  if(bpmScore===0) return {total:0,bpmScore,keyScore,energyScore,styleScore};
  const popBonus = t.pop > seed.pop + 5 ? 8 : 0;
  const total = bpmScore + keyScore + energyScore + styleScore + popBonus;
  return {total,bpmScore,keyScore,energyScore,styleScore};
}
function keyCompat(a, b) {
  const s=camelotScore(a,b);
  if(s===100) return {label:"PERFECTO", color:T.green, desc:"Misma clave — transición inaudible"};
  if(s>=90)   return {label:"ARMÓNICO", color:T.lime,  desc:"Adyacente mismo modo — fluye"};
  if(s>=75)   return {label:"MODAL",    color:T.yellow,desc:"Relativo mayor/menor"};
  if(s>=50)   return {label:"TENSIÓN",  color:T.orange,desc:"Adyacente cruzado — atrevido"};
  if(s>=15)   return {label:"SALTO",    color:"#f97316",desc:"Salto de 2–3 — requiere habilidad"};
  return             {label:"CHOQUE",   color:T.red,   desc:"Evitar o usar con intención"};
}
function isHouseTrack(track) {
  return track.style.some(s=>["dark house","deep house","dub house","chicago","ghetto house","bass","dub"].includes(s));
}

  const max=398;
  const segs=[
    {label:"BPM",val:bpmScore,color:"#0891b2"},
    {label:"KEY",val:keyScore,color:T.lime},
    {label:"NRG",val:energyScore,color:T.orange},
    {label:"STL",val:styleScore,color:T.gold},
  ];
  const total=bpmScore+keyScore+energyScore+styleScore;
  return (
    <div>
      <div style={{display:"flex",height:2,borderRadius:2,overflow:"hidden",gap:1,marginBottom:5}}>
        {segs.map(s=><div key={s.label} style={{width:`${(s.val/max)*100}%`,background:s.color,transition:"width 0.5s"}}/>)}

// MOTOR DE PREESCUCHA — Multi-fuente paralelo + YouTube/Invidious como garantía
// Fuentes: Deezer JSONP → iTunes → Jamendo → Invidious (YT audio) → SoundCloud
// ══════════════════════════════════════════════════════════════════════════════

let _previewAudio = null;
let _previewSetState = null;
let _previewTrackId = null;
const _previewAvailableCache = new Set();

// ── Normalización de texto ────────────────────────────────────────────────
function normStr(s) {
  return (s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();
}

// matchScore: calibrado para electrónica
function matchScore(rArtistRaw, rTitleRaw, track) {
  const rArtist = normStr(rArtistRaw);
  const rTitle  = normStr(rTitleRaw);
  const tArtist = normStr(track.artist);
  const tTitle  = normStr(track.title);
  const clean   = s => s.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const tTitleC = clean(tTitle);
  const rTitleC = clean(rTitle);

  const tArtistFirst = tArtist.split(' ')[0];
  const artistExact  = rArtist === tArtist || rArtist.includes(tArtist) || tArtist.includes(rArtist);
  const artistFirst  = tArtistFirst.length >= 4 && rArtist.includes(tArtistFirst);
  if (!artistExact && !artistFirst) return 0;

  const tWords   = tTitleC.split(' ').filter(w => w.length >= 3);
  const titleExact = rTitleC === tTitleC || rTitleC.includes(tTitleC) || tTitleC.includes(rTitleC);
  const titleWords = tWords.length > 0 && tWords.filter(w => rTitleC.includes(w)).length >= Math.ceil(tWords.length * 0.6);
  if (!titleExact && !titleWords) return 0;

  let score = 0;
  if (rArtist === tArtist) score += 50;
  else if (artistExact)    score += 40;
  else if (artistFirst)    score += 25;

  if (rTitleC === tTitleC) score += 50;
  else if (titleExact)     score += 40;
  else {
    const matched = tWords.filter(w => rTitleC.includes(w)).length;
    score += Math.round((matched / Math.max(tWords.length, 1)) * 32);
  }

  return score;
}

// ── FUENTE 1: Deezer JSONP ────────────────────────────────────────────────
function deezerJsonp(query) {
  return new Promise((resolve, reject) => {
    const cb = '__dz_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);
    function cleanup() { clearTimeout(timer); delete window[cb]; try { document.head.removeChild(script); } catch {} }
    window[cb] = d => { cleanup(); resolve(d); };
    script.onerror = () => { cleanup(); reject(new Error('error')); };
    script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=20&output=jsonp&callback=${cb}`;
    document.head.appendChild(script);
  });
}

async function searchDeezerPreview(track) {
  const a1 = track.artist.split(/[&,+]/)[0].trim();
  const t1  = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const queries = [
    `artist:"${a1}" track:"${t1}"`,
    `${a1} ${t1}`,
    `${track.artist} ${track.title}`,
    `${a1} ${track.title}`,
    t1,
  ];
  for (const q of queries) {
    try {
      const data = await deezerJsonp(q);
      if (!data?.data?.length) continue;
      const scored = data.data.filter(r => r.preview)
        .map(r => ({ r, s: matchScore(r.artist?.name, r.title, track) }))
        .filter(x => x.s >= 55)
        .sort((a, b) => b.s - a.s);
      if (scored.length > 0) return { url: scored[0].r.preview, source: "Deezer" };
    } catch {}
  }
  return null;
}

// ── FUENTE 2: iTunes (directo — soporta CORS desde browser) ──────────────
async function searchItunesPreview(track) {
  const a1 = track.artist.split(/[&,+]/)[0].trim();
  const t1  = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const queries = [`${a1} ${t1}`, `${track.artist} ${t1}`, `${a1} ${track.title}`];
  for (const q of queries) {
    try {
      // iTunes Search API permite CORS directo desde el browser
      const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=15&entity=song`;
      const res  = await fetch(itunesUrl, { signal: AbortSignal.timeout(8000) });
      const data = await res.json();
      const best = (data.results || [])
        .filter(r => r.previewUrl)
        .map(r => ({ r, s: matchScore(r.artistName, r.trackName, track) }))
        .filter(x => x.s >= 55)
        .sort((a, b) => b.s - a.s)[0];
      if (best) return { url: best.r.previewUrl, source: "iTunes" };
    } catch {}
  }
  return null;
}

// ── FUENTE 3: Jamendo via proxy (CORS fix) ────────────────────────────────
async function searchJamendoPreview(track) {
  const CLIENT_ID = "b6747d04";
  const a1 = track.artist.split(/[&,+]/)[0].trim();
  const t1 = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const jamUrl = `https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=10&search=${encodeURIComponent(a1 + ' ' + t1)}&include=musicinfo`;
  // Proxies CORS en orden de confiabilidad (thingproxy eliminado — DNS caído)
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(jamUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(jamUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(jamUrl)}`,
  ];
  for (const proxyUrl of proxies) {
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(7000) });
      if (!res.ok) continue;
      let data;
      const text = await res.text();
      // allorigins devuelve {contents:...}, otros devuelven JSON directo
      try { const wrap = JSON.parse(text); data = wrap.contents ? JSON.parse(wrap.contents) : wrap; }
      catch { continue; }
      const best = (data?.results || [])
        .filter(r => r.audio)
        .map(r => ({ r, s: matchScore(r.artist_name, r.name, track) }))
        .filter(x => x.s >= 55)
        .sort((a, b) => b.s - a.s)[0];
      if (best) return { url: best.r.audio, source: "Jamendo" };
    } catch {}
  }
  return null;
}

// ── FUENTE 4: SoundCloud embed search via proxy ───────────────────────────
async function searchSoundCloudEmbed(track) {
  const a1 = track.artist.split(/[&,+]/)[0].trim();
  const t1  = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const queries = [`${a1} ${t1}`, `${track.artist} ${track.title}`];
  for (const q of queries) {
    const scUrl = `https://soundcloud.com/search/sounds?q=${encodeURIComponent(q)}`;
    const proxyList = [
      `https://corsproxy.io/?${encodeURIComponent(scUrl)}`,
      `https://api.allorigins.win/get?url=${encodeURIComponent(scUrl)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(scUrl)}`,
    ];
    for (const proxyUrl of proxyList) {
      try {
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) continue;
        const raw = await res.text();
        let html = raw;
        // allorigins devuelve {contents:...}
        try { const wrap = JSON.parse(raw); if (wrap.contents) html = wrap.contents; } catch {}
        // Extraemos URLs de tracks de SoundCloud del HTML
        const matches = [...html.matchAll(/\"permalink_url\":\"(https:\\\/\\\/soundcloud\.com\\\/[^"]+)\"/g)]
          .map(m => m[1].replace(/\\\//g, '/'));
        const trackUrls = matches.filter(u => {
          const parts = u.replace('https://soundcloud.com/', '').split('/');
          return parts.length === 2 && !['sets','likes','followers','following','tracks','reposts'].includes(parts[1]);
        });
        if (trackUrls.length > 0) return { url: null, source: "SC", scUrl: trackUrls[0] };
      } catch {}
    }
  }
  return null;
}

// ── FUENTE 5: Invidious API — busca videoId sin proxy ni scraping ──────────
// Invidious es un frontend de YT open-source; sus instancias públicas tienen CORS abierto
async function findYTVideoIdViaOembed(track) {
  const a1 = track.artist.split(/[&,+]/)[0].trim();
  const t1  = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const q   = `${a1} ${t1}`;

  // Instancias Invidious públicas con API habilitada (actualizadas abril 2025)
  const instances = [
    "https://invidious.fdn.fr",
    "https://yt.cdaut.de",
    "https://invidious.lunar.icu",
    "https://inv.nadeko.net",
    "https://invidious.perennialte.ch",
  ];

  for (const inst of instances) {
    try {
      const url = `${inst}/api/v1/search?q=${encodeURIComponent(q)}&type=video&page=1`;
      const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        // Buscamos el resultado más relevante (que tenga el artista en el título/canal)
        const a1Norm = normStr(a1);
        const t1Norm = normStr(t1);
        const best = data.find(v =>
          normStr(v.author || "").includes(a1Norm) ||
          normStr(v.title || "").includes(t1Norm) ||
          normStr(v.title || "").includes(a1Norm)
        ) || data[0];
        if (best?.videoId) return best.videoId;
      }
    } catch {}
  }

  // Fallback: búsqueda via proxy de HTML de YT (método anterior)
  const queries = [`${a1} ${t1}`, `${track.artist} ${track.title}`];
  for (const q of queries) {
    const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}&sp=EgIQAQ%253D%253D`;
    const proxyList = [
      `https://corsproxy.io/?${encodeURIComponent(ytSearchUrl)}`,
      `https://api.allorigins.win/get?url=${encodeURIComponent(ytSearchUrl)}`,
    ];
    for (const proxyUrl of proxyList) {
      try {
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) continue;
        const raw = await res.text();
        let html = raw;
        try { const wrap = JSON.parse(raw); if (wrap.contents) html = wrap.contents; } catch {}
        const matches = [...html.matchAll(/"videoId":"([a-zA-Z0-9_-]{11})"/g)].map(m => m[1]);
        const unique = [...new Set(matches)];
        if (unique.length > 0) return unique[0];
      } catch {}
    }
  }
  return null;
}

// ── FUENTE 5: YouTube embed iframe (fallback visual — sin extracción de audio) ──
// Cargamos el video de YT en un iframe oculto. El usuario escucha pero no vemos el audio.
let _ytIframe = null;
let _ytPlaying = false;
let _ytTrackId = null;
let _ytSetState = null;
let _ytVideoId = null;

function getYTIframe() {
  if (_ytIframe) return _ytIframe;
  const iframe = document.createElement("iframe");
  iframe.id = "yt-hidden-player";
  iframe.allow = "autoplay; encrypted-media";

  _ytIframe = iframe;
  return iframe;
}

function stopYT() {
  if (_ytIframe) { _ytIframe.src = "about:blank"; }

// ── ORQUESTADOR PRINCIPAL ──────────────────────────────────────────────────
// Fase 1 (paralela, rápida): Deezer + iTunes + Jamendo — audio directo 30s
// Fase 2: SoundCloud embed search — excelente para electrónica underground
// Fase 3 (fallback): videoId de YT para iframe embed via allorigins proxy
async function findPreviewUrl(track) {
  // FASE 1: Race paralelo entre fuentes con audio directo
  const fase1 = await new Promise(resolve => {
    let done = false;
    const finish = r => { if (!done) { done = true; resolve(r); } };
    const sources = [
      searchDeezerPreview(track),
      searchItunesPreview(track),
      searchJamendoPreview(track),
    ];
    let pending = sources.length;
    sources.forEach(p => {
      Promise.resolve(p).then(r => {
        if (r?.url) finish(r);
        else { pending--; if (pending === 0) finish(null); }
      }).catch(() => { pending--; if (pending === 0) finish(null); });
    });
    setTimeout(() => finish(null), 12000);
  });
  if (fase1) return fase1;

  // FASE 2: SoundCloud embed (ideal para underground / techno / electrónica)
  try {
    const sc = await Promise.race([
      searchSoundCloudEmbed(track),
      new Promise(r => setTimeout(() => r(null), 10000)),
    ]);
    if (sc?.scUrl) return sc;
  } catch {}

  // FASE 3: Buscar videoId de YouTube para iframe embed
  try {
    const videoId = await Promise.race([
      findYTVideoIdViaOembed(track),
      new Promise(r => setTimeout(() => r(null), 10000)),
    ]);
    if (videoId) return { url: null, source: "YT", videoId };
  } catch {}

  return null;
}


// Detecta si una URL apunta a un archivo de audio reproducible directamente
function isDirectAudioUrl(url) {
  if (!url) return false;
  try {
    const u = new URL(url);
    if (/\.(mp3|ogg|wav|aac|m4a|flac|opus)(\?|$)/i.test(u.pathname)) return true;
    if (u.hostname.includes('dl.dropbox') || u.hostname.includes('storage.googleapis') || u.hostname.includes('amazonaws')) return true;
    return false;
  } catch { return false; }
}

// Detecta si es una URL de página de SoundCloud
function isSoundCloudUrl(url) {
  if (!url) return false;
  try { return new URL(url).hostname.includes('soundcloud.com'); } catch { return false; }
}

// ── SOUNDCLOUD WIDGET PLAYER (iframe) ─────────────────────────────────────
let _scIframe = null;
let _scReady = false;
let _scReadyCallbacks = [];
let _scPlayingUrl = null;
let _scOnEnd = null;
let _scPlayingSetState = null;
let _scPlayingTrackId = null;

function getSCWidgetIframe() {
  if (_scIframe) return _scIframe;
  const iframe = document.createElement("iframe");
  iframe.id = "sc-widget-hidden";
  iframe.allow = "autoplay";
  iframe.style.cssText = "position:fixed;width:1px;height:1px;bottom:0;left:0;opacity:0;pointer-events:none;border:none;";
  iframe.src = "https://w.soundcloud.com/player/?url=https%3A//soundcloud.com&auto_play=false&show_artwork=false&visual=false";
  document.body.appendChild(iframe);
  _scIframe = iframe;
  window.addEventListener("message", (e) => {
    if (!e.origin.includes("soundcloud.com")) return;
    try {
      const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
      if (!d?.soundcloudmessage) return;
      if (d.soundcloudmessage === "ready") { _scReady = true; _scReadyCallbacks.forEach(fn => fn()); _scReadyCallbacks = []; }
      if (d.soundcloudmessage === "finish" && _scOnEnd) { _scOnEnd(); _scOnEnd = null; }
    } catch {}
  });
  return iframe;
}

function playSoundCloudTrack(scPageUrl) {
  return new Promise((resolve, reject) => {
    const iframe = getSCWidgetIframe();
    _scReady = false; _scPlayingUrl = scPageUrl;
    const timeout = setTimeout(() => reject(new Error("SC timeout")), 12000);
    _scReadyCallbacks.push(() => { clearTimeout(timeout); resolve(); });
    iframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(scPageUrl)}&auto_play=true&show_artwork=false&visual=false&buying=false&sharing=false&download=false&show_comments=false&show_playcount=false&show_user=false`;
  });
}

function stopSoundCloud() {
  if (_scIframe) { try { _scIframe.contentWindow?.postMessage(JSON.stringify({ method: "pause" }), "*"); } catch {} }
  _scPlayingUrl = null; _scOnEnd = null;
}

// ── PREVIEW BUTTON ──────────────────────────────────────────────────────────
function PreviewButton({ track, accent }) {
  const [state, setState] = React.useState(() => {
    if (_previewTrackId === track.id && _previewAudio && !_previewAudio.paused) return "playing";
    if (_scPlayingTrackId === track.id && _scPlayingUrl) return "playing";
    if (_ytTrackId === track.id && _ytPlaying) return "playing";
    return "idle";
  });
  const [source, setSource] = React.useState(""); // muestra de qué fuente viene

  React.useEffect(() => {
    if (_previewTrackId === track.id) _previewSetState = setState;
    if (_scPlayingTrackId === track.id) _scPlayingSetState = setState;
    if (_ytTrackId === track.id) _ytSetState = setState;
  });

  function stopAll() {
    // Audio nativo
    if (_previewAudio) { _previewAudio.pause(); _previewAudio = null; }
    if (_previewSetState && _previewSetState !== setState) _previewSetState("idle");
    _previewSetState = null; _previewTrackId = null;
    // SoundCloud
    stopSoundCloud();
    if (_scPlayingSetState && _scPlayingSetState !== setState) _scPlayingSetState("idle");
    _scPlayingSetState = null; _scPlayingTrackId = null;
    // YouTube
    stopYT();
  }

  async function playAudioUrl(url) {
    return new Promise((resolve, reject) => {
      const audio = new Audio(url);
      _previewAudio = audio; _previewSetState = setState; _previewTrackId = track.id;
      audio.addEventListener("canplay", () => audio.play().then(resolve).catch(reject), { once: true });
      audio.addEventListener("error", () => reject(new Error("audio error")), { once: true });
      setTimeout(() => reject(new Error("timeout")), 8000);
      audio.load();
    });
  }

  async function handleClick(e) {
    e.stopPropagation();
    if (state === "playing" || state === "loading") { stopAll(); setState("idle"); setSource(""); return; }
    stopAll();
    setState("loading");

    // 1: SoundCloud URL explícita en el track
    if (isSoundCloudUrl(track.soundcloudUrl)) {
      try {
        _scPlayingSetState = setState; _scPlayingTrackId = track.id;
        await playSoundCloudTrack(track.soundcloudUrl);
        setState("playing"); setSource("SC");
        _scOnEnd = () => { setState("idle"); setSource(""); _scPlayingSetState = null; _scPlayingTrackId = null; };
        return;
      } catch { stopAll(); }
    }

    // 2: Audio directo embebido en el track
    if (track.previewUrl && isDirectAudioUrl(track.previewUrl)) {
      try {
        await playAudioUrl(track.previewUrl);
        setState("playing"); setSource("▶");
        _previewAudio.addEventListener("ended", () => { setState("idle"); setSource(""); _previewAudio = null; _previewSetState = null; _previewTrackId = null; });
        return;
      } catch { stopAll(); }
    }

    // 3: Orquestador completo — Deezer / iTunes / Jamendo → Invidious → YT iframe
    try {
      const r = await findPreviewUrl(track);

      // 3a-sc: SoundCloud encontrado por búsqueda (electrónica underground)
      if (r?.source === "SC" && r?.scUrl) {
        try {
          _scPlayingSetState = setState; _scPlayingTrackId = track.id;
          await playSoundCloudTrack(r.scUrl);
          _previewAvailableCache.add(track.id);
          setState("playing"); setSource("SC");
          _scOnEnd = () => { setState("idle"); setSource(""); _scPlayingSetState = null; _scPlayingTrackId = null; };
          return;
        } catch { stopAll(); }
      }

      // 3b: URL de audio directo (Deezer, iTunes, Jamendo)
      if (r?.url) {
        try {
          await playAudioUrl(r.url);
          _previewAvailableCache.add(track.id);
          setState("playing"); setSource(r.source || "▶");
          _previewAudio.addEventListener("ended", () => { setState("idle"); setSource(""); _previewAudio = null; _previewSetState = null; _previewTrackId = null; });
          return;
        } catch { stopAll(); }
      }

      // 3c: Solo videoId disponible → iframe embed de YouTube
      if (r?.videoId && r?.source === "YT") {
        const iframe = getYTIframe();
        _ytIframe.src = `https://www.youtube.com/embed/${r.videoId}?autoplay=1&start=30`;
        _ytPlaying = true; _ytTrackId = track.id; _ytSetState = setState; _ytVideoId = r.videoId;
        _previewAvailableCache.add(track.id);
        setState("playing"); setSource("YT");
        return;
      }
    } catch { stopAll(); }

    // Nada encontrado — mostramos botón YT directo de inmediato
    setState("yt-link"); setSource("");
  }

  // Si el estado es "yt-link", abrimos YouTube directamente (Invidious no es confiable)
  if (state === "yt-link") {
    const ytQ = encodeURIComponent(`${track.artist} ${track.title}`);
    const handleYtClick = (e) => {
      e.stopPropagation();
      e.preventDefault();
      window.open(`https://www.youtube.com/results?search_query=${ytQ}`, "_blank", "noopener");
    };
    return (
      <button onClick={handleYtClick}
        title="Buscar en YouTube"
        style={{ background:"#ff000012", border:"1px solid #ff000033", color:"#ff4444", fontSize:9, width:26, height:26, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", textDecoration:"none", flexShrink:0, fontFamily:T.mono, fontWeight:700, transition:"all 0.2s", cursor:"pointer" }}>
        YT
      </button>
    );
  }

  const isSC = isSoundCloudUrl(track.soundcloudUrl) || source === "SC";
  const isYT = source === "YT";
  const activeColor = isSC ? "#ff5500" : isYT ? "#ff0000" : accent;

  const map = {
    idle:    { icon:"▶", color: isSC ? "#ff5500" : T.textDim, bg: T.surface, border: T.border, title: "Preescucha" },
    loading: { icon:"…", color:"#f59e0b", bg:"#1a1200", border:"#f59e0b33", title:"Buscando preview…" },
    playing: { icon:"■", color: activeColor, bg:`${activeColor}12`, border:`${activeColor}55`, title:`Detener (${source || "audio"})` },
    nf:      { icon:"✕", color: T.textGhost, bg: T.surface, border: T.border, title:"No encontrado" },
  };
  const s = map[state] || map.idle;

  return (
    <div style={{ position:"relative", flexShrink:0 }}>
      <button onClick={handleClick} title={s.title} style={{
        background: s.bg, border:`1px solid ${s.border}`, color: s.color,
        fontSize: state === "loading" ? 9 : 11, width:26, height:26, borderRadius:7,
        cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
        transition:"all 0.2s", WebkitTapHighlightColor:"transparent",
        fontWeight:700, fontFamily:T.mono, flexShrink:0,
      }}>{s.icon}</button>
      {source && state === "playing" && (
        <div style={{ position:"absolute", bottom:-11, left:"50%", transform:"translateX(-50%)", fontFamily:T.mono, fontSize:6, color:activeColor, letterSpacing:0.5, whiteSpace:"nowrap", opacity:0.85 }}>{source}</div>
      )}
    </div>
  );
}

function EnergyFlowChart({ tracks }) {
  if(tracks.length<2) return null;
  const W=330,H=60,pad=12;
  const xStep=(W-pad*2)/(tracks.length-1);
  const toY=e=>pad+(H-pad*2)*(1-(e-1)/9);
  const pts=tracks.map((t,i)=>({x:pad+i*xStep,y:toY(t.energy),t}));
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++) d+=` C ${pts[i-1].x+xStep*0.5} ${pts[i-1].y},${pts[i].x-xStep*0.5} ${pts[i].y},${pts[i].x} ${pts[i].y}`;
  return (
    <div style={{padding:"10px 12px 4px"}}>
      <div style={{fontFamily:T.sans,fontWeight:700,fontSize:7.5,color:T.textDim,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>flujo de energía</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
        <defs><linearGradient id="eG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.gold} stopOpacity="0.12"/><stop offset="100%" stopColor={T.gold} stopOpacity="0"/></linearGradient></defs>
        {[1,3,5,7,9].map(e=><line key={e} x1={pad} x2={W-pad} y1={toY(e)} y2={toY(e)} stroke="#141210" strokeWidth="1" strokeDasharray="2,4"/>)}
        <path d={d+` L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`} fill="url(#eG)"/>
        <path d={d} fill="none" stroke={T.gold} strokeWidth="1.5" strokeLinecap="round"/>
        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="2.5" fill={E_COLORS[p.t.energy]} stroke="#060504" strokeWidth="1.5"/>)}

      </div>
    </div>
  );
}

// Todos los estilos únicos del catálogo
const ALL_BUILD_STYLES = [...new Set(Object.values(TRACKS.reduce((acc,t)=>{t.style.forEach(s=>{acc[s]=s});return acc},{})))].sort();

// Chequeo si un estilo entra en el filtro seleccionado (directo o por familia)
function matchesStyleFilter(track, styleFilter) {
  if(styleFilter==="all") return true;
  if(track.style.includes(styleFilter)) return true;
  // Buscar en todas las familias que contengan el filtro elegido
  for(const [fam, members] of Object.entries(STYLE_FAMILY)) {
    if(members.includes(styleFilter) && track.style.some(s=>members.includes(s))) return true;
    if(fam===styleFilter && track.style.some(s=>members.includes(s))) return true;
  }
  return false;
}

// Auto-build greedy: construye la secuencia completa desde el seed
// Usa umbral adaptativo: si no hay candidatos con score alto, baja el umbral
function autoBuild(seed, styleFilter, maxPop, maxTracks=8, allTracks=TRACKS) {
  const pool = allTracks.filter(t =>
    t.id !== seed.id &&
    (t.isEmergent || t.pop <= maxPop) &&
    matchesStyleFilter(t, styleFilter)
  );

  const sequence = [seed];
  const used = new Set([seed.id]);

  for(let step = 0; step < maxTracks - 1; step++) {
    const last = sequence[sequence.length - 1];
    const setStyles = sequence.flatMap(x => x.style);

    const scored = pool
      .filter(t => !used.has(t.id))
      .map(t => {
        const sc = scoreMatch(last, t);

        // Penaliza drift total de BPM respecto al seed
        const bpmDrift = Math.abs(t.bpm - seed.bpm);
        const driftPenalty = bpmDrift > 18 ? -60 : bpmDrift > 12 ? -25 : bpmDrift > 8 ? -10 : 0;

        // Bonus cohesión: el estilo ya apareció en el set
        const cohesionBonus = t.style.filter(s => setStyles.includes(s)).length * 12;

        // Bonus narrativa: leve preferencia a subir energía en primeros pasos, bajar al final
        const progress = step / (maxTracks - 2);
        const eDiff = t.energy - last.energy;
        const narrativeBonus = progress < 0.5 ? (eDiff === 1 ? 15 : eDiff === 0 ? 5 : -5)
                                               : (eDiff === -1 ? 10 : eDiff === 0 ? 5 : -5);

        return {
          ...t,
          scoreData: sc,
          rawTotal: sc.total,
          adjustedTotal: sc.total + driftPenalty + cohesionBonus + narrativeBonus
        };
      })
      .filter(t => t.rawTotal > 0)  // solo descartar si BPM o key son 0
      .sort((a, b) => b.adjustedTotal - a.adjustedTotal);

    if(scored.length === 0) break;

    // Umbral adaptativo: intenta >120 primero, luego baja si no hay
    const best = scored.find(t => t.adjustedTotal >= 120)
               || scored.find(t => t.adjustedTotal >= 80)
               || scored[0];

    sequence.push(best);
    used.add(best.id);
  }

  return sequence.slice(1); // sin la semilla
}

// Auto-build con control de arco de energía, variación aleatoria y fusión de estilos
function autoBuildAdvanced(opts) {
  var styles = opts.styles;
  var arcKey = opts.arc;
  var length = opts.length;
  var maxPop = opts.maxPop;
  var variation = opts.variation;

  var pool = TRACKS.filter(function(t) {
    if (t.pop > maxPop) return false;
    for (var si = 0; si < styles.length; si++) {
      if (matchesStyleFilter(t, styles[si])) return true;
    }
    return false;
  });
  if (pool.length === 0) return { seed: null, tracks: [] };

  var arcFn = (ENERGY_ARCS[arcKey] && ENERGY_ARCS[arcKey].fn) ? ENERGY_ARCS[arcKey].fn : ENERGY_ARCS.buildup.fn;
  var seedETarget = arcFn(0, 0);

  var seedPool = pool.slice().sort(function(a, b) {
    var aDiff = Math.abs(a.energy - seedETarget);
    var bDiff = Math.abs(b.energy - seedETarget);
    var nz = variation * 2.5;
    return (aDiff + Math.random() * nz) - (bDiff + Math.random() * nz);
  });

  var chosenSeed = seedPool[0];
  var sequence = [chosenSeed];
  var usedIds = {};
  usedIds[chosenSeed.id] = true;

  var denom = length > 1 ? length - 1 : 1;

  for (var step = 0; step < length - 1; step++) {
    var progress = (step + 1) / denom;
    var targetE = arcFn(progress, step + 1);
    var last = sequence[sequence.length - 1];

    var usedStylesArr = [];
    for (var si2 = 0; si2 < sequence.length; si2++) {
      for (var si3 = 0; si3 < sequence[si2].style.length; si3++) {
        usedStylesArr.push(sequence[si2].style[si3]);
      }
    }

    var recentArtists = [];
    for (var ri = Math.max(0, sequence.length - 3); ri < sequence.length; ri++) {
      recentArtists.push(sequence[ri].artist);
    }

    var candidates = [];
    for (var ci = 0; ci < pool.length; ci++) {
      var t = pool[ci];
      if (usedIds[t.id]) continue;

      var bpmDiff = Math.abs(t.bpm - last.bpm);
      var bpmScore = bpmDiff===0?100:bpmDiff<=2?95:bpmDiff<=4?85:bpmDiff<=7?65:bpmDiff<=12?35:bpmDiff<=16?15:5;
      var keyScore = camelotScore(last.key, t.key);
      var eDiff = Math.abs(t.energy - targetE);
      var arcBonus = eDiff===0?40:eDiff===1?20:eDiff===2?0:-20*(eDiff-2);

      var cohesion = 0;
      for (var csi = 0; csi < t.style.length; csi++) {
        if (usedStylesArr.indexOf(t.style[csi]) >= 0) cohesion += 10;
      }

      var totalDrift = Math.abs(t.bpm - chosenSeed.bpm);
      var driftPenalty = totalDrift > 18 ? -50 : totalDrift > 12 ? -20 : totalDrift > 8 ? -8 : 0;
      var randNoise = (Math.random() - 0.5) * variation * 40;
      var artistPenalty = recentArtists.indexOf(t.artist) >= 0 ? -35 : 0;
      var score = bpmScore + keyScore + arcBonus + cohesion + driftPenalty + randNoise + artistPenalty;

      candidates.push({ track: t, score: score });
    }

    if (candidates.length === 0) break;
    candidates.sort(function(a, b) { return b.score - a.score; });
    var best = candidates[0].track;
    sequence.push(best);
    usedIds[best.id] = true;
  }

  return { seed: chosenSeed, tracks: sequence.slice(1) };
}

// ── ALGORITMO MEJORADO con venue + anti-repetición ────────────────────────────
// Usa un pool de exclusión persistente para garantizar que cada regeneración
// produzca una semilla distinta y tracks nunca repetidos entre reshuffles
let _lastUsedSeedIds = new Set();
let _lastUsedTrackIds = new Set();

function autoBuildWithVenue(opts) {
  var styles    = opts.styles;
  var arcKey    = opts.arc;
  var length    = opts.length;
  var maxPop    = opts.maxPop;
  var variation = opts.variation;
  var bpmBias   = opts.bpmBias || 0;
  var energyBias= opts.energyBias || 0;
  var forceNew  = opts.forceNew || false;   // true = ignora cache

  // Pool filtrado por estilo y popularidad
  var pool = TRACKS.filter(function(t) {
    if (t.pop > maxPop) return false;
    for (var si = 0; si < styles.length; si++) {
      if (matchesStyleFilter(t, styles[si])) return true;
    }
    return false;
  });
  if (pool.length === 0) return { seed: null, tracks: [], reshuffleCount: 0 };

  var arcFn = (ENERGY_ARCS[arcKey] && ENERGY_ARCS[arcKey].fn)
    ? ENERGY_ARCS[arcKey].fn
    : ENERGY_ARCS.buildup.fn;

  // ── Elegir semilla DIFERENTE a la última usada ──
  var seedETarget = Math.min(10, Math.max(1, arcFn(0, 0) + energyBias));
  var noiseMag = variation * 3.5;

  // Excluir semillas ya usadas si hay suficiente pool
  var seedCandidates = pool.slice().filter(function(t) {
    return forceNew ? !_lastUsedSeedIds.has(t.id) : true;
  });
  if (seedCandidates.length === 0) {
    _lastUsedSeedIds.clear();
    seedCandidates = pool.slice();
  }

  seedCandidates.sort(function(a, b) {
    var aDiff = Math.abs(a.energy - seedETarget);
    var bDiff = Math.abs(b.energy - seedETarget);
    return (aDiff + Math.random() * noiseMag) - (bDiff + Math.random() * noiseMag);
  });

  var chosenSeed = seedCandidates[0];
  _lastUsedSeedIds.add(chosenSeed.id);
  if (_lastUsedSeedIds.size > Math.floor(pool.length * 0.6)) _lastUsedSeedIds.clear();

  var sequence  = [chosenSeed];
  var usedIds   = {};
  usedIds[chosenSeed.id] = true;

  // Excluir tracks de sesiones anteriores para garantizar variedad entre reshuffles
  var recentlyUsed = forceNew ? new Set(_lastUsedTrackIds) : new Set();

  var denom = length > 1 ? length - 1 : 1;

  for (var step = 0; step < length - 1; step++) {
    var progress = (step + 1) / denom;
    var targetE  = Math.min(10, Math.max(1, arcFn(progress, step + 1) + energyBias));
    var last     = sequence[sequence.length - 1];

    var usedStylesArr = [];
    for (var si2 = 0; si2 < sequence.length; si2++) {
      for (var si3 = 0; si3 < sequence[si2].style.length; si3++) {
        usedStylesArr.push(sequence[si2].style[si3]);
      }
    }

    // Penalizar artistas recientes (últimos 3 tracks)
    var recentArtists = [];
    for (var ri = Math.max(0, sequence.length - 3); ri < sequence.length; ri++) {
      recentArtists.push(sequence[ri].artist);
    }

    var candidates = [];
    for (var ci = 0; ci < pool.length; ci++) {
      var t = pool[ci];
      if (usedIds[t.id]) continue;

      var bpmTarget = last.bpm + bpmBias * 0.3; // drift sutil por venue
      var bpmDiff   = Math.abs(t.bpm - bpmTarget);
      var bpmScore  = bpmDiff===0?100:bpmDiff<=2?95:bpmDiff<=4?85:bpmDiff<=7?65:bpmDiff<=12?35:bpmDiff<=16?15:5;
      var keyScore  = camelotScore(last.key, t.key);
      var eDiff     = Math.abs(t.energy - targetE);
      var arcBonus  = eDiff===0?40:eDiff===1?20:eDiff===2?0:-20*(eDiff-2);

      var cohesion = 0;
      for (var csi = 0; csi < t.style.length; csi++) {
        if (usedStylesArr.indexOf(t.style[csi]) >= 0) cohesion += 10;
      }

      var totalDrift  = Math.abs(t.bpm - chosenSeed.bpm);
      var driftPenalty = totalDrift > 18 ? -50 : totalDrift > 12 ? -20 : totalDrift > 8 ? -8 : 0;

      // Penalización fuerte a tracks usados recientemente (anti-repetición)
      var recentPenalty = recentlyUsed.has(t.id) ? -80 : 0;
      var artistPenalty = recentArtists.indexOf(t.artist) >= 0 ? -40 : 0;

      // Ruido aleatorio — controlado por variation
      var randNoise = (Math.random() - 0.5) * variation * 50;

      var score = bpmScore + keyScore + arcBonus + cohesion + driftPenalty + recentPenalty + artistPenalty + randNoise;
      candidates.push({ track: t, score: score });
    }

    if (candidates.length === 0) break;
    candidates.sort(function(a, b) { return b.score - a.score; });

    // Elegir entre el top-3 (no siempre el #1) para más variedad
    var topN = Math.min(3, candidates.length);
    var chosen = candidates[Math.floor(Math.random() * topN * variation + 0.5 > topN-1 ? topN-1 : Math.floor(Math.random() * topN * variation + 0.5))].track;
    // Simplificado: top-1 cuando variation=0, mezcla hasta top-3 cuando variation alto
    var pickIdx = variation > 0.5 ? Math.floor(Math.random() * Math.min(3, candidates.length)) : 0;
    chosen = candidates[pickIdx].track;

    sequence.push(chosen);
    usedIds[chosen.id] = true;
    recentlyUsed.add(chosen.id);
  }

  // Actualizar cache de tracks usados para próximo reshuffle
  sequence.forEach(function(t) { _lastUsedTrackIds.add(t.id); });
  if (_lastUsedTrackIds.size > Math.floor(TRACKS.length * 0.5)) _lastUsedTrackIds.clear();

  return { seed: chosenSeed, tracks: sequence.slice(1) };
}

// Mini energy arc visualizer (sparkline SVG)
function ArcSparkline({ arcKey, width=120, height=24 }) {
  const arc = ENERGY_ARCS[arcKey];
  if (!arc) return null;
  const pts = 10;
  const vals = Array.from({length:pts},(_,i) => arc.fn(i/(pts-1), i));
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const range = mx - mn || 1;
  const points = vals.map((v,i) => {
    const x = 4 + (i/(pts-1))*(width-8);
    const y = (height-4) - ((v-mn)/range)*(height-8);
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg width={width} height={height} style={{display:"block"}}>
      <polyline points={points} fill="none" stroke={arc.color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.7"/>
      {vals.map((v,i)=>{
        const x = 4 + (i/(pts-1))*(width-8);
        const y = (height-4) - ((v-mn)/range)*(height-8);
        return <circle key={i} cx={x} cy={y} r="1.5" fill={arc.color} opacity="0.5"/>;
      })}
    </svg>
  );
}

                    <div style={{width:28,height:4,background:"#141210",borderRadius:2,flexShrink:0}}>
                      <div style={{width:`${t.energy*10}%`,height:"100%",background:eColor,borderRadius:2}}/>
                    </div>
                    <span style={{fontFamily:T.mono,fontSize:7,color:eColor,width:8,flexShrink:0}}>{t.energy}</span>
                  </div>
                );
              })}
              {preview.tracks.length > 6 && (
                <div style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",paddingLeft:18,marginTop:2}}>+ {preview.tracks.length-6} tracks más</div>
              )}
            </div>
          )}

          {!preview && selectedStyles.length === 0 && step !== 0 && (
            <div style={{textAlign:"center",padding:"20px 24px 8px"}}>
              <div style={{fontFamily:T.sans,fontSize:10,color:"#9a9490",lineHeight:1.8}}>Seleccioná al menos un estilo<br/>para generar el set</div>
            </div>
          )}
        </div>

        {/* ── CTA ── */}
        <div style={{background:"rgba(8,7,5,0.97)",borderTop:"1px solid #141210",padding:"10px 14px",flexShrink:0}}>
          <div style={{display:"flex",gap:6}}>
            {canProceed && (
              <button onClick={handleReshuffle}
                title="Generar otro set completamente distinto"
                style={{
                  padding:"11px 14px",borderRadius:10,border:`1px solid ${accentColor}33`,cursor:"pointer",
                  background:`${accentColor}0a`,fontFamily:T.sans,fontWeight:700,fontSize:13,
                  color:accentColor,WebkitTapHighlightColor:"transparent",transition:"all 0.15s"
                }}
              >⟳</button>
            )}
            <button
              onClick={canBuild ? handleBuild : canProceed ? handleReshuffle : ()=>setStep(1)}
              style={{
                flex:1,padding:"12px 0",borderRadius:10,border:"none",cursor:"pointer",
                background: canBuild ? `linear-gradient(135deg,#1e1608,#0d0b05)` : canProceed ? "#0d0c08" : "#0a0906",
                outline: canBuild ? `1px solid ${accentColor}66` : canProceed ? `1px solid ${accentColor}33` : "1px solid #141210",
                fontFamily:T.sans,fontWeight:800,fontSize:11.5,letterSpacing:0.3,
                color: canBuild ? accentColor : canProceed ? accentColor+"99" : "#282624",
                transition:"all 0.18s",WebkitTapHighlightColor:"transparent"
              }}
            >
              {!venue && !canProceed ? "↑ elegí un venue primero" :
               !canProceed ? "↑ elegí un estilo" :
               !canBuild ? "⟳ generar set" :
               `✦ ARMAR SET · ${preview.tracks.length+1} tracks`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function BuildScreen({ seed, setSeed, mySet, addToSet, setMySet, maxPop, onFind, djTracks=[] }) {
  const [tab, setTab]               = useState("auto");   // "auto" | "manual"
  const [styleFilter, setStyleFilter] = useState("all");
  const [showInfo, setShowInfo]     = useState(false);
  const [showAutoBuildModal, setShowAutoBuildModal] = useState(false);

  const allTracks = React.useMemo(()=>[...TRACKS,...djTracks],[djTracks]);

  const handleAutoBuild = (newSeed, newTracks) => {
    setSeed(newSeed);
    setMySet(newTracks);
  };

  const availableStyles = React.useMemo(()=>{
    return ["all", ...[...new Set(allTracks.flatMap(t=>t.style))].sort()];
  },[allTracks]);

  // AUTO-BUILD: siempre calculado, sin guard por tab
  const autoTracks = useMemo(()=>{
    if(!seed) return [];
    return autoBuild(seed, styleFilter, maxPop, 30, allTracks);
  },[seed, styleFilter, maxPop, allTracks]);

  // MANUAL: candidatos rankeados
  const recs = useMemo(()=>{
    if(!seed) return [];
    return allTracks
      .filter(t => t.id!==seed.id && (t.isEmergent||t.pop<=maxPop) && matchesStyleFilter(t,styleFilter))
      .map(t => ({...t, scoreData:scoreMatch(seed,t)}))
      .filter(t => t.scoreData.total > 0)
      .sort((a,b) => b.scoreData.total - a.scoreData.total)
      .slice(0,20);
  },[seed, maxPop, styleFilter, allTracks]);

  const handleAddAll = () => {
    const toAdd = autoTracks.filter(t => !mySet.some(s=>s.id===t.id));
    if(toAdd.length > 0) setMySet(prev => [...prev, ...toAdd]);
  };

  if(!seed) return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>

          onClick={()=>setShowAutoBuildModal(true)}

            width:"100%",maxWidth:280,padding:"15px 24px",borderRadius:14,

        <div style={{display:"flex",alignItems:"center",gap:10,width:"100%",maxWidth:280}}>

          <div style={{flex:1,height:1,background:"#141210"}}/>
        </div>
        <div style={{fontFamily:T.sans,fontSize:9,color:"#a8a4a0",textAlign:"center",lineHeight:1.7}}>

                {c:T.orange,lbl:"NRG",desc:"+1 nivel→100 (narrativa)  igual→90  -1→80"},
                {c:T.gold,  lbl:"STL",desc:"Match directo×45 · familia de estilos→30"},

                <div key={r.lbl} style={{display:"flex",gap:8,alignItems:"center",marginBottom:5}}>

          <div style={{flex:1,overflowY:"auto",padding:"6px 10px 100px",scrollbarWidth:"none"}}>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {recs.length===0 ? (
                <div style={{textAlign:"center",padding:"40px 20px",fontFamily:T.sans,fontSize:11,color:"#a8a4a0",lineHeight:2}}>

                </div>
              ) : recs.map(t=>{
                const c = keyCompat(seed.key,t.key);
                return (
                  <div key={t.id}>
                    <TrackCard track={t} scoreData={t.scoreData} showScore onAdd={addToSet} inSet={mySet.some(s=>s.id===t.id)} onSelect={()=>{}} onFind={onFind}/>
                    <div style={{display:"flex",gap:8,padding:"3px 6px 0",alignItems:"center"}}>
                      <span style={{fontFamily:T.sans,fontSize:7.5,fontWeight:700,color:c.color,letterSpacing:0.8}}>{c.label}</span>
                      <span style={{color:"#141210"}}>·</span>
                      <span style={{fontFamily:T.sans,fontSize:7.5,color:T.textDim}}>{c.desc}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function SetScreen({ mySet, setMySet, onFind }) {
  const moveUp=i=>{if(i===0)return;const a=[...mySet];[a[i-1],a[i]]=[a[i],a[i-1]];setMySet(a);};
  const moveDown=i=>{if(i===mySet.length-1)return;const a=[...mySet];[a[i],a[i+1]]=[a[i+1],a[i]];setMySet(a);};
  const remove=id=>setMySet(p=>p.filter(t=>t.id!==id));
  if(mySet.length===0) return <EmptyState icon={<LogoMark size={56}/>} headline="tu set está vacío" sub={"Explorá LIBRARY para descubrir tracks\ny usá BUILD para encontrar el siguiente\ntrack compatible. Agregá con '+'."}/>; 
  const avgBpm=Math.round(mySet.reduce((a,t)=>a+t.bpm,0)/mySet.length);
  const avgE=(mySet.reduce((a,t)=>a+t.energy,0)/mySet.length).toFixed(1);
  const dur=mySet.length*7;
  let harmSum=0;
  for(let i=1;i<mySet.length;i++) harmSum+=camelotScore(mySet[i-1].key,mySet[i].key);
  const harm=mySet.length>1?Math.round(harmSum/(mySet.length-1)):100;
  const harmColor=harm>=80?T.green:harm>=60?T.yellow:T.orange;
  return (

function InstallBanner() {
  const [show, setShow] = React.useState(false);
  const [deferredPrompt, setDeferredPrompt] = React.useState(null);
  const [isIOS, setIsIOS] = React.useState(false);
  const [dismissed, setDismissed] = React.useState(false);

  React.useEffect(() => {
    // Ya instalada → no mostrar
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    // Ya descartada antes
    if (localStorage.getItem('setlab_banner_dismissed')) return;

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (ios) { setIsIOS(true); setTimeout(()=>setShow(true), 3000); return; }

    const handler = e => { e.preventDefault(); setDeferredPrompt(e); setTimeout(()=>setShow(true), 3000); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  function dismiss() {
    setShow(false);
    setDismissed(true);
    localStorage.setItem('setlab_banner_dismissed', '1');
  }

  async function install() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') setShow(false);
    }
  }

  if (!show || dismissed) return null;

  return (
    <div style={{
      position:"fixed", bottom:80, left:"50%", transform:"translateX(-50%)",
      width:"calc(100% - 32px)", maxWidth:398, zIndex:300,
      background:"linear-gradient(135deg,#0e0b06,#1a1206)",
      border:`1px solid ${T.gold}44`, borderRadius:16,
      padding:"14px 16px", boxShadow:"0 8px 32px rgba(0,0,0,0.6)",
      animation:"slideUp 0.4s cubic-bezier(.2,0,.2,1)"
    }}>
      <style>{`@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}`}</style>
      <button onClick={dismiss} style={{position:"absolute",top:10,right:12,background:"none",border:"none",color:T.textDim,fontSize:14,cursor:"pointer",padding:2}}>✕</button>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:44,height:44,borderRadius:12,background:"#030302",border:`1px solid ${T.gold}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <LogoMark size={32}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:T.sans,fontWeight:800,fontSize:13,color:T.gold,letterSpacing:-0.3}}>Instalá SetLab</div>
          <div style={{fontFamily:T.sans,fontSize:9.5,color:T.textMid,marginTop:2,lineHeight:1.5}}>
            {isIOS ? "Tocá compartir 􀈂 → \"Agregar a inicio\"" : "Agregá la app a tu pantalla de inicio"}
          </div>
        </div>
        {!isIOS && (
          <button onClick={install} style={{
            background:`${T.gold}18`, border:`1px solid ${T.gold}55`,
            color:T.gold, fontFamily:T.sans, fontWeight:800, fontSize:10,
            padding:"8px 14px", borderRadius:10, cursor:"pointer",
            flexShrink:0, letterSpacing:0.3, WebkitTapHighlightColor:"transparent"
          }}>Instalar</button>
        )}
      </div>
      {isIOS && (
        <div style={{marginTop:10,padding:"8px 12px",background:"#080706",borderRadius:10,border:"1px solid #1e1c18"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>1️⃣</span>
            <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid}}>Tocá el botón <strong style={{color:T.text}}>Compartir</strong> en Safari (ícono de flecha hacia arriba)</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
            <span style={{fontSize:16}}>2️⃣</span>
            <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid}}>Seleccioná <strong style={{color:T.text}}>"Agregar a pantalla de inicio"</strong></span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
            <span style={{fontSize:16}}>3️⃣</span>
            <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid}}>Tocá <strong style={{color:T.text}}>"Agregar"</strong> — SetLab queda en tu inicio</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ── DJ SET BUILDER — armado de set solo con tracks emergentes ─────────────
function DjSetBuilder({ djTracks, mySet, addToSet, removeFromSet }) {
  const [djSet, setDjSet] = React.useState([]); // set local de emergentes
  const [seed, setSeed] = React.useState(null);
  const [showSeedPicker, setShowSeedPicker] = React.useState(false);

  // Guardar/cargar set local en localStorage
  const DJ_SET_KEY = "setlab_dj_set_v1";
  React.useEffect(()=>{
    try { const s=JSON.parse(localStorage.getItem(DJ_SET_KEY)||"[]"); if(s.length) setDjSet(s); } catch {}
  },[]);
  function saveDjSet(s){ setDjSet(s); try{localStorage.setItem(DJ_SET_KEY,JSON.stringify(s));}catch{} }

  const addToDjSet = t => { if(!djSet.some(s=>s.id===t.id)) saveDjSet([...djSet,t]); };
  const removeFromDjSet = id => saveDjSet(djSet.filter(t=>t.id!==id));
  const moveUp = i => { if(i===0)return; const a=[...djSet];[a[i-1],a[i]]=[a[i],a[i-1]];saveDjSet(a); };
  const moveDown = i => { if(i===djSet.length-1)return; const a=[...djSet];[a[i],a[i+1]]=[a[i+1],a[i]];saveDjSet(a); };

  // Auto-build: dado un seed (primer track), construir secuencia armónica
  function autoBuild() {
    if(!seed||djTracks.length<2) return;
    const used = new Set([seed.id]);
    const seq = [seed];
    let last = seed;
    for(let i=0;i<Math.min(djTracks.length-1,15);i++){
      const candidates = djTracks
        .filter(t=>!used.has(t.id))
        .map(t=>({t, score:scoreMatch(last,t).total}))
        .filter(x=>x.score>0)
        .sort((a,b)=>b.score-a.score);
      if(!candidates.length) break;
      const next = candidates[0].t;
      seq.push(next); used.add(next.id); last=next;
    }
    saveDjSet(seq);
  }

  // Stats del set
  const avgBpm = djSet.length ? Math.round(djSet.reduce((a,t)=>a+t.bpm,0)/djSet.length) : 0;
  const avgE = djSet.length ? (djSet.reduce((a,t)=>a+t.energy,0)/djSet.length).toFixed(1) : 0;
  const dur = djSet.length*7;
  let harmSum=0;
  for(let i=1;i<djSet.length;i++) harmSum+=camelotScore(djSet[i-1].key,djSet[i].key);
  const harm = djSet.length>1 ? Math.round(harmSum/(djSet.length-1)) : 100;
  const harmColor = harm>=80?T.green:harm>=60?T.yellow:T.orange;

  // Exportar al set global
  function exportToMainSet(){
    djSet.forEach(t=>addToSet(t));
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Stats */}
      {djSet.length>0&&(
        <div style={{margin:"8px 12px 0",display:"flex",background:"#060408",border:`1px solid ${DJ_ACCENT}18`,borderRadius:12,overflow:"hidden",flexShrink:0}}>
          {[[djSet.length,"TRACKS"],[`${Math.floor(dur/60)}h${dur%60>0?` ${dur%60}m`:""}`, "DUR"],[avgBpm,"BPM"],[avgE,"NRG"]].map(([v,l],i,arr)=>(
            <div key={l} style={{flex:1,padding:"10px 0",textAlign:"center",borderRight:i<arr.length-1?`1px solid ${DJ_ACCENT}12`:"none"}}>
              <div style={{fontFamily:T.sans,fontWeight:800,fontSize:i===0?16:13,color:DJ_ACCENT,letterSpacing:-0.3}}>{v}</div>
              <div style={{fontFamily:T.mono,fontSize:6,color:T.textGhost,letterSpacing:1.5,marginTop:2,textTransform:"uppercase"}}>{l}</div>
            </div>
          ))}
        </div>
      )}
      {djSet.length>1&&(
        <div style={{margin:"5px 12px 0",background:"#060408",border:`1px solid ${DJ_ACCENT}12`,borderRadius:10,padding:"8px 14px",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontFamily:T.sans,fontWeight:700,fontSize:7,color:T.textGhost,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>cohesión armónica</div>
            <div style={{height:2,width:120,background:"#141210",borderRadius:2}}>
              <div style={{height:"100%",width:`${harm}%`,background:harmColor,borderRadius:2,transition:"width 0.5s"}}/>
            </div>
          </div>
          <span style={{fontFamily:T.sans,fontWeight:800,fontSize:18,color:harmColor,letterSpacing:-1}}>{harm}%</span>
        </div>
      )}
      {/* Toolbar */}
      <div style={{padding:"8px 12px 4px",display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
        <span style={{fontFamily:T.mono,fontSize:8,color:T.textGhost,flex:1}}>{djSet.length} tracks en el set emergente</span>
        {/* Auto-build */}
        <button onClick={()=>setShowSeedPicker(true)} style={{background:`${DJ_ACCENT}12`,border:`1px solid ${DJ_ACCENT}33`,color:DJ_ACCENT,fontFamily:T.sans,fontWeight:700,fontSize:8,padding:"5px 10px",borderRadius:8,cursor:"pointer",letterSpacing:0.3,WebkitTapHighlightColor:"transparent",whiteSpace:"nowrap"}}>⚡ Auto-build</button>
        {djSet.length>0&&<button onClick={exportToMainSet} style={{background:"#071a07",border:"1px solid #22c55e33",color:T.green,fontFamily:T.sans,fontWeight:700,fontSize:8,padding:"5px 10px",borderRadius:8,cursor:"pointer",letterSpacing:0.3,WebkitTapHighlightColor:"transparent",whiteSpace:"nowrap"}}>→ Exportar al Set</button>}
        {djSet.length>0&&<button onClick={()=>saveDjSet([])} style={{background:"none",border:"none",fontFamily:T.sans,fontWeight:500,color:"#3a1a1a",fontSize:8,cursor:"pointer",padding:0,whiteSpace:"nowrap"}}>limpiar</button>}
      </div>

      {/* Seed picker modal */}
      {showSeedPicker&&(
        <div style={{position:"absolute",inset:0,zIndex:200,background:"rgba(0,0,0,0.93)",display:"flex",flexDirection:"column",backdropFilter:"blur(8px)",borderRadius:14}}>
          <div style={{padding:"16px 16px 8px",display:"flex",alignItems:"center",gap:10,borderBottom:`1px solid ${DJ_ACCENT}20`}}>
            <span style={{fontFamily:T.sans,fontWeight:700,fontSize:13,color:DJ_ACCENT,flex:1}}>⚡ Elegí el track semilla</span>
            <button onClick={()=>setShowSeedPicker(false)} style={{background:"none",border:"none",color:T.textDim,fontSize:16,cursor:"pointer",padding:0}}>✕</button>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"8px 12px 20px"}}>
            {djTracks.length===0&&<div style={{textAlign:"center",padding:"40px 0",fontFamily:T.sans,fontSize:11,color:T.textDim}}>No hay tracks emergentes aún</div>}
            {djTracks.map(t=>(
              <button key={t.id} onClick={()=>{setSeed(t);setShowSeedPicker(false);setTimeout(()=>autoBuildWith(t),50);}} style={{width:"100%",background:"#0a0609",border:`1px solid ${DJ_ACCENT}18`,borderRadius:10,padding:"10px 12px",marginBottom:5,cursor:"pointer",textAlign:"left",WebkitTapHighlightColor:"transparent",transition:"border-color 0.15s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:T.sans,fontWeight:700,fontSize:12,color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</div>
                    <div style={{fontFamily:T.sans,fontSize:9,color:DJ_ACCENT,marginTop:1}}>{t.artist}</div>
                  </div>
                  <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
                    <KeyPill k={t.key}/>
                    <span style={{fontFamily:T.mono,fontSize:8,color:T.textDim}}>{t.bpm}</span>
                    <EBar energy={t.energy} showLabel/>
                  </div>
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Empty state */}
      {djSet.length===0&&!showSeedPicker&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:"0 40px",textAlign:"center"}}>
          <div style={{fontSize:32,opacity:0.1}}>🎛</div>
          <div style={{fontFamily:T.sans,fontWeight:700,fontSize:12,color:T.textMid}}>Set emergente vacío</div>
          <div style={{fontFamily:T.sans,fontSize:9.5,color:T.textDim,lineHeight:2}}>
            Usá <span style={{color:DJ_ACCENT,fontWeight:700}}>⚡ Auto-build</span> para armar una secuencia armónica automática, o agregá tracks desde la pestaña Tracks.
          </div>
          {djTracks.length>0&&<button onClick={()=>setShowSeedPicker(true)} style={{background:`${DJ_ACCENT}15`,border:`1px solid ${DJ_ACCENT}44`,color:DJ_ACCENT,fontFamily:T.sans,fontWeight:700,fontSize:11,padding:"10px 22px",borderRadius:10,cursor:"pointer",letterSpacing:0.3,WebkitTapHighlightColor:"transparent"}}>⚡ Auto-build ahora</button>}
          {djTracks.length===0&&<div style={{fontFamily:T.sans,fontSize:9,color:T.textGhost}}>Primero agregá tracks en la pestaña Tracks</div>}
        </div>

      {/* Set list */}
      {djSet.length>0&&(
        <div style={{flex:1,overflowY:"auto",padding:"0 10px 90px",scrollbarWidth:"none"}}>
          <div style={{display:"flex",flexDirection:"column",gap:0}}>
            {djSet.map((track,i)=>{

                    <div style={{fontFamily:T.mono,fontSize:7.5,color:T.textGhost,width:18,textAlign:"center",flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0,background:"#070509",border:`1px solid ${DJ_ACCENT}18`,borderRadius:10,padding:"9px 12px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:T.sans,fontWeight:700,fontSize:11.5,color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{track.title}</div>
                          <div style={{fontFamily:T.sans,fontSize:9,color:DJ_ACCENT,marginTop:1,opacity:0.8}}>{track.artist}</div>
                        </div>
                        <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
                          <KeyPill k={track.key}/>
                          <span style={{fontFamily:T.mono,fontSize:8,color:T.textDim}}>{track.bpm}</span>
                          <EBar energy={track.energy} showLabel/>
                        </div>
                      </div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      {[["↑",()=>moveUp(i),"#3a3836"],["↓",()=>moveDown(i),"#3a3836"],["✕",()=>removeFromDjSet(track.id),"#501818"]].map(([lbl,fn,col])=>(
                        <button key={lbl} onClick={fn} style={{background:"#070509",border:`1px solid ${DJ_ACCENT}12`,color:col,width:22,height:22,borderRadius:5,cursor:"pointer",fontSize:9,display:"flex",alignItems:"center",justifyContent:"center",WebkitTapHighlightColor:"transparent",fontWeight:700,fontFamily:T.sans}}>{lbl}</button>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );

  // Helper para auto-build con track específico (evita closure stale)
  function autoBuildWith(seedTrack) {
    if(!seedTrack||djTracks.length<1) return;
    const used = new Set([seedTrack.id]);
    const seq = [seedTrack];
    let last = seedTrack;
    for(let i=0;i<Math.min(djTracks.length-1,20);i++){
      const candidates = djTracks
        .filter(t=>!used.has(t.id))
        .map(t=>({t, score:scoreMatch(last,t).total}))
        .filter(x=>x.score>0)
        .sort((a,b)=>b.score-a.score);
      if(!candidates.length) break;
      const next = candidates[0].t;
      seq.push(next); used.add(next.id); last=next;
    }
    saveDjSet(seq);
  }
}

function DJsScreen({ djTracks, setDjTracks, mySet, addToSet, removeFromSet }) {

  const [editTrack, setEditTrack] = React.useState(null);
  const [expandedArtist, setExpandedArtist] = React.useState(null);

  // Agrupar por artista para la DB
  const artistsMap = React.useMemo(()=>{
    const map = {};
    djTracks.forEach(t=>{
      if(!map[t.artist]) map[t.artist]=[];
      map[t.artist].push(t);
    });
    return map;
  },[djTracks]);
  const artistList = React.useMemo(()=>Object.keys(artistsMap).sort(),[artistsMap]);

  const filtered = React.useMemo(()=>djTracks.filter(t=>{
    if(search){const q=search.toLowerCase();return t.title.toLowerCase().includes(q)||t.artist.toLowerCase().includes(q);}
    return true;
  }),[djTracks,search]);

  const filteredArtists = React.useMemo(()=>artistList.filter(a=>{
    if(!search) return true;
    const q=search.toLowerCase();
    return a.toLowerCase().includes(q)||artistsMap[a].some(t=>t.title.toLowerCase().includes(q));

    if (editTrack) {

function useIsDesktop() {
  const [desk, setDesk] = React.useState(()=>window.innerWidth >= 900);
  React.useEffect(()=>{
    const fn = ()=>setDesk(window.innerWidth>=900);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);
  return desk;
}

  );

  // ── MOBILE LAYOUT — header y footer siempre visibles ──────────────────────
  const HEADER_H = env_safe_area_top() + 52; // 44 safe area + 52 header
  const NAV_H = 64;
  return (
    <ScaleCtx.Provider value={scale}>
    <div style={{height:"100vh",overflow:"hidden",background:T.bg,position:"relative"}}>

      {/* HEADER FIJO — siempre visible */}
      <div style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:T.bgAlt,borderBottom:`1px solid ${T.border}`}}>
        <div style={{height:env_safe_area_top()}}/>
        <div style={{height:52,display:"flex",alignItems:"center",padding:"0 14px 0 20px",justifyContent:"space-between",maxWidth:430,margin:"0 auto",width:"100%"}}>
          <LogoFull/>
          <SettingsBar theme={theme} setThemeFn={setThemeFn} scale={scale} setScaleFn={setScaleFn} compact={true}/>
        </div>
      </div>

      {/* CONTENIDO SCROLLABLE — entre header y nav */}
      <div style={{
        position:"absolute", top:HEADER_H, bottom:NAV_H, left:0, right:0,
        overflowY:"auto", overflowX:"hidden",
        WebkitOverflowScrolling:"touch", scrollbarWidth:"none",
      }}>
        <div style={{zoom:scale, maxWidth:430, margin:"0 auto", minHeight:"100%", background:T.bgAlt, display:"flex", flexDirection:"column"}}>
          {tab==="library"&&<LibraryScreen seed={seed} setSeed={handleSeed} mySet={mySet} addToSet={addToSet} maxPop={maxPop} setMaxPop={setMaxPop} styleFilter={style} setStyleFilter={setStyle} search={search} setSearch={setSearch} onFind={setFindTrack} djTracks={djTracks}/>}
          {tab==="build"&&<BuildScreen seed={seed} setSeed={t=>{setSeed(t);if(!t)setTab("library");}} mySet={mySet} addToSet={addToSet} setMySet={setMySet} maxPop={maxPop} onFind={setFindTrack} djTracks={djTracks}/>}
          {tab==="set"&&<SetScreen mySet={mySet} setMySet={setMySet} onFind={setFindTrack}/>}
          {tab==="djs"&&<DJsScreen djTracks={djTracks} setDjTracks={setDjTracks} mySet={mySet} addToSet={addToSet} removeFromSet={removeFromSet}/>}
        </div>
      </div>

      {/* NAV INFERIOR FIJA — siempre visible */}
      <div style={{
        position:"fixed", bottom:0, left:0, right:0, zIndex:100,
        background:T.isDark?"rgba(4,3,2,0.97)":T.bgAlt,
        borderTop:`1px solid ${T.border}`,
        display:"flex", paddingBottom:"env(safe-area-inset-bottom,8px)",
        backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
      }}>
        <div style={{display:"flex",width:"100%",maxWidth:430,margin:"0 auto"}}>
          {tabs.map(({id,label,badge})=>{
            const active=tab===id;
            const accent=id==="djs"?DJ_ACCENT:T.gold;
            return (
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",position:"relative",WebkitTapHighlightColor:"transparent",padding:"10px 0"}}>
                {active&&<div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:20,height:1.5,background:accent,borderRadius:"0 0 2px 2px"}}/>}
                <TabIcon id={id} active={active}/>
                <span style={{fontFamily:T.sans,fontWeight:active?700:500,fontSize:7.5,color:active?accent:T.textGhost,letterSpacing:1.2,textTransform:"uppercase"}}>{label}</span>
                {badge&&<div style={{position:"absolute",top:5,right:"calc(50% - 20px)",background:accent,color:"#000",fontFamily:T.sans,fontWeight:800,fontSize:7,width:14,height:14,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{badge}</div>}
              </button>
            );
          })}
        </div>
      </div>

      {findTrack&&<FindModal track={findTrack} onClose={()=>setFindTrack(null)}/>}
      <InstallBanner/>
    </div>
    </ScaleCtx.Provider>
  );
}

function env_safe_area_top() { return 44; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ── PWA: MANIFEST INLINE ──────────────────────────────────────────────────
(function(){
  const manifest = {
    name: "SetLab — DJ Set Planner",
    short_name: "SetLab",
    description: "Planeá tus sets de DJ con compatibilidad armónica y energía",
    start_url: "./",
    display: "standalone",
    background_color: "#030302",
    theme_color: "#030302",
    orientation: "portrait",
    icons: [
      { src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%23030302'/%3E%3Ccircle cx='256' cy='256' r='200' fill='none' stroke='%23c9a84c' stroke-width='12'/%3E%3Ccircle cx='256' cy='256' r='140' fill='none' stroke='%23c9a84c' stroke-width='6' opacity='.4'/%3E%3Ccircle cx='256' cy='256' r='80' fill='%23c9a84c' opacity='.25'/%3E%3Ccircle cx='256' cy='256' r='28' fill='%23c9a84c'/%3E%3C/svg%3E", sizes:"512x512", type:"image/svg+xml", purpose:"any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  document.getElementById("pwa-manifest").href = URL.createObjectURL(blob);
})();

// ── PWA: SERVICE WORKER ───────────────────────────────────────────────────
if('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'setlab-v1';
const ASSETS = ['./', './index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
`;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).then(()=>{
    console.log('[SetLab] PWA lista — instalable desde el navegador');
  }).catch(()=>{});
}
</script>
