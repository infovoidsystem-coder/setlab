  body.light select option{background:#ffffff;color:#1c1a17}

  /* ── Inputs del formulario DJs ── */
  .sl-input {
    width:100%; border-radius:10px; padding:11px 13px;
    font-family:'Syne',sans-serif; font-size:13px; outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sl-input:focus { box-shadow: 0 0 0 2px #a855f730; }
  body:not(.light) .sl-input {
    background:#1c1914; border:1px solid #2e2c28;
    color:#e8e2d9;
  }
  body:not(.light) .sl-input::placeholder { color:#706860; }
  body:not(.light) .sl-input:focus { border-color:#a855f766; background:#201d18; }
  body.light .sl-input {
    background:#f8f6f2; border:1px solid #d4cfc8;
    color:#1c1a17;
  }
  body.light .sl-input::placeholder { color:#a0998f; }
  body.light .sl-input:focus { border-color:#a855f766; background:#ffffff; }

  .sl-select {
    width:100%; border-radius:10px; padding:11px 13px;
    font-family:'DM Mono',monospace; font-size:13px; outline:none; cursor:pointer;
    transition: border-color 0.2s;
    -webkit-appearance:none; appearance:none;

  }

  body.light .sl-select {
    background-color:#f8f6f2; border:1px solid #d4cfc8; color:#1c1a17;
  }
  body.light .sl-select:focus { border-color:#a855f766; }
  body.light .sl-select option { background:#ffffff; color:#1c1a17; }

const T = { ...DARK_T };
function applyTheme(name) {
  const src = name === "light" ? LIGHT_T : DARK_T;
  Object.assign(T, src);
  document.body.style.background = T.bg;
  document.body.className = name === "light" ? "light" : "";
  try { localStorage.setItem("setlab_theme", name); } catch {}
}

function camelotScore(a, b) {
  const nA=parseInt(a), nB=parseInt(b), lA=a.slice(-1), lB=b.slice(-1);
  if(nA===nB&&lA===lB) return 100; // mismo — perfecto
  if(nA===nB) return 75;           // relativo mayor/menor
  const d=Math.min(Math.abs(nA-nB),12-Math.abs(nA-nB));
  if(d===1&&lA===lB) return 90;   // adyacente mismo modo
  if(d===1&&lA!==lB) return 50;   // adyacente cruzado
  if(d===2&&lA===lB) return 30;   // salto de 2 mismo modo
  if(d===2&&lA!==lB) return 15;   // salto de 2 cruzado
  if(d===3&&lA===lB) return 10;   // salto de 3 — arriesgado
  if(d===3&&lA!==lB) return 5;
  return 2;                        // > 3 — muy arriesgado pero no cero (no bloquear autobuild)
}
// styleCompatScore: calcula compatibilidad de estilos usando STYLE_FAMILY
function styleCompatScore(stylesA, stylesB) {
  // Match directo
  for (const s of stylesA) {
    if (stylesB.includes(s)) return 45;
  }
  // Match por familia de estilos
  for (const s of stylesA) {
    const familyA = STYLE_FAMILY[s] || [s];
    for (const t of stylesB) {
      const familyB = STYLE_FAMILY[t] || [t];
      if (familyA.some(f => familyB.includes(f))) return 30;
    }
  }
  return 10;
}

// scoreMatch: solo bloquea si BPM completamente incompatible (>16 BPM de diferencia)
function scoreMatch(seed, t) {
  const d = Math.abs(seed.bpm - t.bpm);
  const bpmScore = d===0?100:d<=2?95:d<=4?85:d<=7?65:d<=12?35:d<=15?10:0;
  const keyScore = camelotScore(seed.key, t.key); // nunca 0
  const eDiff = t.energy - seed.energy;
  const energyScore = eDiff===0?90:eDiff===1?100:eDiff===-1?80:eDiff===2?70:eDiff===-2?60:eDiff===3?50:eDiff===-3?30:10;
  const styleScore = styleCompatScore(seed.style, t.style);
  if(bpmScore===0) return {total:0,bpmScore,keyScore,energyScore,styleScore};
  const popBonus = t.pop > seed.pop + 5 ? 8 : 0;
  const total = bpmScore + keyScore + energyScore + styleScore + popBonus;
  return {total,bpmScore,keyScore,energyScore,styleScore};
}
function keyCompat(a, b) {
  const s=camelotScore(a,b);
  if(s===100) return {label:"PERFECTO", color:T.green, desc:"Misma clave — transición inaudible"};
  if(s>=90)   return {label:"ARMÓNICO", color:T.lime,  desc:"Adyacente mismo modo — fluye"};
  if(s>=75)   return {label:"MODAL",    color:T.yellow,desc:"Relativo mayor/menor"};
  if(s>=50)   return {label:"TENSIÓN",  color:T.orange,desc:"Adyacente cruzado — atrevido"};
  if(s>=15)   return {label:"SALTO",    color:"#f97316",desc:"Salto de 2–3 — requiere habilidad"};
  return             {label:"CHOQUE",   color:T.red,   desc:"Evitar o usar con intención"};
}
function isHouseTrack(track) {
  return track.style.some(s=>["dark house","deep house","dub house","chicago","ghetto house","bass","dub"].includes(s));
}

// ── PREESCUCHA GLOBAL ──────────────────────────────────────────────────────
let _previewAudio = null;
let _previewSetState = null;

async function searchItunesPreview(track) {
  // Genera múltiples variantes de búsqueda, de más específica a más amplia
  const firstArtist = track.artist.split(/[&,+]/)[0].trim();
  const shortTitle  = track.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim(); // sin paréntesis
  const titleWords  = shortTitle.split(' ').slice(0, 4).join(' ');           // primeras 4 palabras
  const queries = [
    `${firstArtist} ${shortTitle}`,          // artista principal + título limpio
    `${firstArtist} ${titleWords}`,           // artista principal + primeras palabras
    `${track.artist} ${titleWords}`,          // artista completo + primeras palabras
    shortTitle,                               // solo título limpio
    `${firstArtist} ${track.title.split(' ')[0]}`, // artista + primera palabra del título
  ];
  for (const q of queries) {
    try {
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=10&entity=song`);
      const data = await res.json();
      const hit = data.results.find(r => r.previewUrl);
      if (hit) return hit.previewUrl;
    } catch { /* seguir con la siguiente */ }
  }
  return null;
}

function PreviewButton({ track, accent }) {
  const [state, setState] = React.useState("idle"); // idle|loading|playing|error|nf

  function stopCurrent() {
    if (_previewAudio) { _previewAudio.pause(); _previewAudio = null; }
    if (_previewSetState) { _previewSetState("idle"); _previewSetState = null; }
  }

  async function handleClick(e) {
    e.stopPropagation();
    if (state === "playing" || state === "loading") {
      stopCurrent();
      setState("idle");
      return;
    }
    stopCurrent();
    setState("loading");
    try {
      const previewUrl = await searchItunesPreview(track);
      if (!previewUrl) { setState("nf"); setTimeout(()=>setState("idle"),2500); return; }
      const audio = new Audio(previewUrl);
      _previewAudio = audio;
      _previewSetState = setState;
      audio.addEventListener("ended", () => { setState("idle"); _previewAudio=null; _previewSetState=null; });
      audio.addEventListener("error", () => { setState("error"); setTimeout(()=>setState("idle"),2000); _previewAudio=null; _previewSetState=null; });
      audio.play();
      setState("playing");
    } catch {
      setState("error");
      setTimeout(()=>setState("idle"),2000);
    }
  }

  const map = {
    idle:    { icon:"▶", color:"#3a9e6a", bg:"#0e0e0c", border:"#1e1c1a", title:"Preescucha 30s" },
    loading: { icon:"…", color:"#706860", bg:"#0e0e0c", border:"#1e1c1a", title:"Buscando…"       },
    playing: { icon:"■", color:accent,    bg:`${accent}12`, border:`${accent}44`, title:"Detener"  },
    error:   { icon:"✕", color:T.red,     bg:"#0e0e0c", border:"#1e1c1a", title:"Sin preview"     },
    nf:      { icon:"∅", color:T.textDim, bg:"#0e0e0c", border:"#1e1c1a", title:"No encontrado"   },
  };
  const s = map[state] || map.idle;
  return (
    <button onClick={handleClick} title={s.title} style={{
      background:s.bg, border:`1px solid ${s.border}`, color:s.color,
      fontSize:state==="loading"?9:11, width:26, height:26, borderRadius:7,
      cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
      transition:"all 0.2s", WebkitTapHighlightColor:"transparent",
      fontWeight:700, fontFamily:T.mono, flexShrink:0,
    }}>{s.icon}</button>
  );
}

function EnergyFlowChart({ tracks }) {
  if(tracks.length<2) return null;
  const W=330,H=60,pad=12;
  const xStep=(W-pad*2)/(tracks.length-1);
  const toY=e=>pad+(H-pad*2)*(1-(e-1)/9);
  const pts=tracks.map((t,i)=>({x:pad+i*xStep,y:toY(t.energy),t}));
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++) d+=` C ${pts[i-1].x+xStep*0.5} ${pts[i-1].y},${pts[i].x-xStep*0.5} ${pts[i].y},${pts[i].x} ${pts[i].y}`;
  return (
    <div style={{padding:"10px 12px 4px"}}>
      <div style={{fontFamily:T.sans,fontWeight:700,fontSize:7.5,color:T.textDim,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>flujo de energía</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
        <defs><linearGradient id="eG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.gold} stopOpacity="0.12"/><stop offset="100%" stopColor={T.gold} stopOpacity="0"/></linearGradient></defs>
        {[1,3,5,7,9].map(e=><line key={e} x1={pad} x2={W-pad} y1={toY(e)} y2={toY(e)} stroke="#141210" strokeWidth="1" strokeDasharray="2,4"/>)}
        <path d={d+` L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`} fill="url(#eG)"/>
        <path d={d} fill="none" stroke={T.gold} strokeWidth="1.5" strokeLinecap="round"/>
        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="2.5" fill={E_COLORS[p.t.energy]} stroke="#060504" strokeWidth="1.5"/>)}
      </svg>
      <div style={{display:"flex",justifyContent:"space-between",padding:`0 ${pad}px`}}>
        {tracks.map((_,i)=><span key={i} style={{fontFamily:T.mono,fontSize:6.5,color:T.textGhost}}>{i+1}</span>)}
      </div>
    </div>
  );
}

const ALL_BUILD_STYLES = [...new Set(Object.values(TRACKS.reduce((acc,t)=>{t.style.forEach(s=>{acc[s]=s});return acc},{})))].sort();

// Chequeo si un estilo entra en el filtro seleccionado (directo o por familia)
function matchesStyleFilter(track, styleFilter) {
  if(styleFilter==="all") return true;
  if(track.style.includes(styleFilter)) return true;
  // Buscar en todas las familias que contengan el filtro elegido
  for(const [fam, members] of Object.entries(STYLE_FAMILY)) {
    if(members.includes(styleFilter) && track.style.some(s=>members.includes(s))) return true;
    if(fam===styleFilter && track.style.some(s=>members.includes(s))) return true;
  }
  return false;
}

// Auto-build greedy: construye la secuencia completa desde el seed
// Usa umbral adaptativo: si no hay candidatos con score alto, baja el umbral
function autoBuild(seed, styleFilter, maxPop, maxTracks=8, allTracks=TRACKS) {
  const pool = allTracks.filter(t =>
    t.id !== seed.id &&
    (t.isEmergent || t.pop <= maxPop) &&
    matchesStyleFilter(t, styleFilter)
  );

  const sequence = [seed];
  const used = new Set([seed.id]);

  for(let step = 0; step < maxTracks - 1; step++) {
    const last = sequence[sequence.length - 1];
    const setStyles = sequence.flatMap(x => x.style);

    const scored = pool
      .filter(t => !used.has(t.id))
      .map(t => {
        const sc = scoreMatch(last, t);

        // Penaliza drift total de BPM respecto al seed
        const bpmDrift = Math.abs(t.bpm - seed.bpm);
        const driftPenalty = bpmDrift > 18 ? -60 : bpmDrift > 12 ? -25 : bpmDrift > 8 ? -10 : 0;

        // Bonus cohesión: el estilo ya apareció en el set
        const cohesionBonus = t.style.filter(s => setStyles.includes(s)).length * 12;

        // Bonus narrativa: leve preferencia a subir energía en primeros pasos, bajar al final
        const progress = step / (maxTracks - 2);
        const eDiff = t.energy - last.energy;
        const narrativeBonus = progress < 0.5 ? (eDiff === 1 ? 15 : eDiff === 0 ? 5 : -5)
                                               : (eDiff === -1 ? 10 : eDiff === 0 ? 5 : -5);

        return {
          ...t,
          scoreData: sc,
          rawTotal: sc.total,
          adjustedTotal: sc.total + driftPenalty + cohesionBonus + narrativeBonus
        };
      })
      .filter(t => t.rawTotal > 0)  // solo descartar si BPM o key son 0
      .sort((a, b) => b.adjustedTotal - a.adjustedTotal);

    if(scored.length === 0) break;

    // Umbral adaptativo: intenta >120 primero, luego baja si no hay
    const best = scored.find(t => t.adjustedTotal >= 120)
               || scored.find(t => t.adjustedTotal >= 80)
               || scored[0];

    sequence.push(best);
    used.add(best.id);
  }

  return sequence.slice(1); // sin la semilla
}

// Auto-build con control de arco de energía, variación aleatoria y fusión de estilos
function autoBuildAdvanced(opts) {
  var styles = opts.styles;
  var arcKey = opts.arc;
  var length = opts.length;
  var maxPop = opts.maxPop;
  var variation = opts.variation;

  var pool = TRACKS.filter(function(t) {
    if (t.pop > maxPop) return false;
    for (var si = 0; si < styles.length; si++) {
      if (matchesStyleFilter(t, styles[si])) return true;
    }
    return false;
  });
  if (pool.length === 0) return { seed: null, tracks: [] };

  var arcFn = (ENERGY_ARCS[arcKey] && ENERGY_ARCS[arcKey].fn) ? ENERGY_ARCS[arcKey].fn : ENERGY_ARCS.buildup.fn;
  var seedETarget = arcFn(0, 0);

  var seedPool = pool.slice().sort(function(a, b) {
    var aDiff = Math.abs(a.energy - seedETarget);
    var bDiff = Math.abs(b.energy - seedETarget);
    var nz = variation * 2.5;
    return (aDiff + Math.random() * nz) - (bDiff + Math.random() * nz);
  });

  var chosenSeed = seedPool[0];
  var sequence = [chosenSeed];
  var usedIds = {};
  usedIds[chosenSeed.id] = true;

  var denom = length > 1 ? length - 1 : 1;

  for (var step = 0; step < length - 1; step++) {
    var progress = (step + 1) / denom;
    var targetE = arcFn(progress, step + 1);
    var last = sequence[sequence.length - 1];

    var usedStylesArr = [];
    for (var si2 = 0; si2 < sequence.length; si2++) {
      for (var si3 = 0; si3 < sequence[si2].style.length; si3++) {
        usedStylesArr.push(sequence[si2].style[si3]);
      }
    }

    var recentArtists = [];
    for (var ri = Math.max(0, sequence.length - 3); ri < sequence.length; ri++) {
      recentArtists.push(sequence[ri].artist);
    }

    var candidates = [];
    for (var ci = 0; ci < pool.length; ci++) {
      var t = pool[ci];
      if (usedIds[t.id]) continue;

      var bpmDiff = Math.abs(t.bpm - last.bpm);
      var bpmScore = bpmDiff===0?100:bpmDiff<=2?95:bpmDiff<=4?85:bpmDiff<=7?65:bpmDiff<=12?35:bpmDiff<=16?15:5;
      var keyScore = camelotScore(last.key, t.key);
      var eDiff = Math.abs(t.energy - targetE);
      var arcBonus = eDiff===0?40:eDiff===1?20:eDiff===2?0:-20*(eDiff-2);

      var cohesion = 0;
      for (var csi = 0; csi < t.style.length; csi++) {
        if (usedStylesArr.indexOf(t.style[csi]) >= 0) cohesion += 10;
      }

      var totalDrift = Math.abs(t.bpm - chosenSeed.bpm);
      var driftPenalty = totalDrift > 18 ? -50 : totalDrift > 12 ? -20 : totalDrift > 8 ? -8 : 0;
      var randNoise = (Math.random() - 0.5) * variation * 40;
      var artistPenalty = recentArtists.indexOf(t.artist) >= 0 ? -35 : 0;
      var score = bpmScore + keyScore + arcBonus + cohesion + driftPenalty + randNoise + artistPenalty;

      candidates.push({ track: t, score: score });
    }

    if (candidates.length === 0) break;
    candidates.sort(function(a, b) { return b.score - a.score; });
    var best = candidates[0].track;
    sequence.push(best);
    usedIds[best.id] = true;
  }

  return { seed: chosenSeed, tracks: sequence.slice(1) };
}

// Mini energy arc visualizer (sparkline SVG)
function ArcSparkline({ arcKey, width=120, height=24 }) {
  const arc = ENERGY_ARCS[arcKey];
  if (!arc) return null;
  const pts = 10;
  const vals = Array.from({length:pts},(_,i) => arc.fn(i/(pts-1), i));
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const range = mx - mn || 1;
  const points = vals.map((v,i) => {
    const x = 4 + (i/(pts-1))*(width-8);
    const y = (height-4) - ((v-mn)/range)*(height-8);
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg width={width} height={height} style={{display:"block"}}>
      <polyline points={points} fill="none" stroke={arc.color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.7"/>
      {vals.map((v,i)=>{
        const x = 4 + (i/(pts-1))*(width-8);
        const y = (height-4) - ((v-mn)/range)*(height-8);
        return <circle key={i} cx={x} cy={y} r="1.5" fill={arc.color} opacity="0.5"/>;
      })}
    </svg>
  );
}

function AutoBuildModal({ onClose, onBuild, maxPop }) {

  const [variation, setVariation] = React.useState(0.3); // 0=determinista, 1=muy aleatorio
  const [preview, setPreview] = React.useState(null);
  const [step, setStep] = React.useState(0); // 0=estilos, 1=parámetros

  const compute = (styles, arcKey, len, vari) => {
    if (styles.length === 0) { setPreview(null); return; }
    const result = autoBuildAdvanced({ styles, arc: arcKey, length: len, maxPop, variation: vari });
    setPreview(result);
  };
  const toggleStyle = (styleId) => {
    const next = selectedStyles.includes(styleId) ? selectedStyles.filter(s=>s!==styleId) : [...selectedStyles, styleId];
    setSelectedStyles(next);
    compute(next, arc, length, variation);
  };

  const handleLength = (n) => { setLength(n); compute(selectedStyles, arc, n, variation); };
  const handleVariation = (v) => { setVariation(v); compute(selectedStyles, arc, length, v); };
  const handleBuild = () => {
    if (!preview?.seed || preview.tracks.length === 0) return;
    onBuild(preview.seed, preview.tracks);
    onClose();
  };
  const handleReshuffle = () => { compute(selectedStyles, arc, length, variation); };

  const canBuild = preview?.seed && preview?.tracks?.length > 0;

                            border:`1px solid ${active?ac:T.border}`,
                            borderRadius:10,padding:"9px 13px",cursor:"pointer",
                            display:"flex",justifyContent:"space-between",alignItems:"center",
                            WebkitTapHighlightColor:"transparent",transition:"all 0.1s",textAlign:"left"
                          }}
                        >
                          <div>
                            <div style={{fontFamily:T.sans,fontWeight:700,fontSize:11,color:active?ac:T.text,letterSpacing:-0.2}}>{s.label}</div>
                            <div style={{fontFamily:T.mono,fontSize:7,color:active?T.textDim:T.textGhost,marginTop:2}}>{s.desc}</div>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                            <span style={{fontFamily:T.mono,fontSize:7,color:active?ac:T.textGhost}}>{count} tracks</span>
                            <div style={{
                              width:16,height:16,borderRadius:4,border:`1.5px solid ${active?ac:"#1e1c1a"}`,
                              background:active?ac:"transparent",display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:9,color:"#000",fontWeight:900,flexShrink:0
                            }}>{active?"✓":""}</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ══ TAB 1: ENERGÍA + VARIACIÓN ══ */}
          {step===1 && (
            <div style={{padding:"12px 14px 100px"}}>

              {/* Duración */}
              <div style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontFamily:T.sans,fontWeight:700,fontSize:9,color:T.textMid,letterSpacing:0.5}}>DURACIÓN</span>
                  <span style={{fontFamily:T.mono,fontSize:9.5,color:T.gold}}>{length} tracks <span style={{color:"#a8a4a0",fontSize:7.5}}>≈ {Math.floor(length*7/60)}h{(length*7)%60>0?` ${(length*7)%60}m`:""}</span></span>
                </div>
                <div style={{display:"flex",gap:4}}>
                  {[8,12,16,20,25,30].map(n=>(
                    <button key={n} onClick={()=>handleLength(n)}
                      style={{flex:1,padding:"8px 0",borderRadius:8,cursor:"pointer",border:"none",
                        fontFamily:T.sans,fontWeight:700,fontSize:11,
                        background:length===n?"#1a1508":T.surface,color:length===n?T.gold:"#282624",
                        outline:length===n?`1px solid ${T.goldDim}`:"1px solid #141210",WebkitTapHighlightColor:"transparent"
                      }}
                    >{n}</button>
                  ))}
                </div>
              </div>

              {/* Arco de energía */}
              <div style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontFamily:T.sans,fontWeight:700,fontSize:9,color:T.textMid,letterSpacing:0.5}}>ARCO DE ENERGÍA</span>
                  <span style={{fontFamily:T.mono,fontSize:8,color:ENERGY_ARCS[arc].color}}>{ENERGY_ARCS[arc].icon} {ENERGY_ARCS[arc].label}</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:3}}>
                  {Object.entries(ENERGY_ARCS).map(([key,a])=>{
                    const active = arc===key;
                    return (
                      <button key={key} onClick={()=>handleArc(key)}
                        style={{
                          background:active?`${a.color}10`:"#0a0906",
                          border:`1px solid ${active?a.color:"#141210"}`,
                          borderRadius:10,padding:"9px 13px",cursor:"pointer",
                          display:"flex",justifyContent:"space-between",alignItems:"center",
                          WebkitTapHighlightColor:"transparent",transition:"all 0.1s"
                        }}
                      >
                        <div style={{textAlign:"left"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7}}>
                            <span style={{fontFamily:T.mono,fontSize:13,color:active?a.color:"#a8a4a0"}}>{a.icon}</span>
                            <span style={{fontFamily:T.sans,fontWeight:700,fontSize:11,color:active?a.color:T.textMid}}>{a.label}</span>
                          </div>
                          <div style={{fontFamily:T.mono,fontSize:7,color:active?"#4a4540":"#1e1c1a",marginTop:2,paddingLeft:22}}>{a.desc}</div>
                        </div>
                        <ArcSparkline arcKey={key} width={80} height={22}/>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Variación */}
              <div style={{background:"#0a0906",border:"1px solid #141210",borderRadius:10,padding:"12px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div>
                    <div style={{fontFamily:T.sans,fontWeight:700,fontSize:9,color:T.textMid,letterSpacing:0.5}}>VARIACIÓN</div>
                    <div style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",marginTop:2}}>cuánto cambia el set cada vez</div>
                  </div>
                  <span style={{fontFamily:T.mono,fontSize:9,color:T.gold}}>
                    {variation<0.2?"exacto":variation<0.5?"leve":variation<0.75?"medio":"alto"}
                  </span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",width:28,flexShrink:0}}>fijo</span>
                  <input type="range" min={0} max={1} step={0.05} value={variation}
                    onChange={e=>handleVariation(+e.target.value)}
                    style={{flex:1,accentColor:T.gold,cursor:"pointer"}}
                  />
                  <span style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",width:28,flexShrink:0,textAlign:"right"}}>🎲</span>
                </div>
                <div style={{marginTop:8,display:"flex",justifyContent:"space-between"}}>
                  {["Siempre igual","Algo diferente","Bastante distinto","Total sorpresa"].map((lbl,i)=>(
                    <span key={i} style={{fontFamily:T.mono,fontSize:6,color:"#9a9490",textAlign:"center",flex:1}}>{lbl}</span>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── PREVIEW ── (siempre visible al fondo) */}
          {preview?.seed && (
            <div style={{margin:"0 14px 8px",background:"#0a0906",border:"1px solid #1a1814",borderRadius:12,padding:"10px 13px",flexShrink:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontFamily:T.mono,fontSize:7,color:"#aca49a",letterSpacing:1.5,textTransform:"uppercase"}}>preview</div>
                <button onClick={handleReshuffle} style={{background:"none",border:"1px solid #1c1a18",color:"#aca49a",fontFamily:T.mono,fontSize:7,padding:"2px 8px",borderRadius:5,cursor:"pointer",letterSpacing:0.5}}>⟳ otro set</button>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                <span style={{fontFamily:T.mono,fontSize:7,color:T.goldDim,width:12,textAlign:"center",flexShrink:0}}>S</span>
                <span style={{fontFamily:T.sans,fontWeight:700,fontSize:10,color:T.gold,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{preview.seed.title}</span>
                <span style={{fontFamily:T.mono,fontSize:7.5,color:"#a8a4a0",flexShrink:0}}>{preview.seed.bpm}</span>
              </div>
              {preview.tracks.slice(0,5).map((t,i)=>{
                const eColor = E_COLORS[t.energy] || "#333";
                return (
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                    <span style={{fontFamily:T.mono,fontSize:7,color:T.textGhost,width:12,textAlign:"center",flexShrink:0}}>{i+1}</span>
                    <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid,flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</span>
                    <span style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",flexShrink:0}}>{t.bpm}</span>
                    <div style={{width:32,height:4,background:"#141210",borderRadius:2,flexShrink:0}}>
                      <div style={{width:`${t.energy*10}%`,height:"100%",background:eColor,borderRadius:2}}/>
                    </div>
                    <span style={{fontFamily:T.mono,fontSize:7,color:eColor,width:8,flexShrink:0}}>{t.energy}</span>
                  </div>
                );
              })}
              {preview.tracks.length > 5 && (
                <div style={{fontFamily:T.mono,fontSize:7,color:"#a8a4a0",paddingLeft:18,marginTop:2}}>+ {preview.tracks.length-5} tracks más</div>
              )}
              {preview.tracks.length === 0 && (
                <div style={{fontFamily:T.sans,fontSize:9,color:"#a8a4a0",paddingLeft:18}}>Sin tracks disponibles con estos filtros.</div>
              )}
            </div>
          )}

          {!preview && selectedStyles.length===0 && (
            <div style={{textAlign:"center",padding:"20px 24px 8px"}}>
              <div style={{fontFamily:T.sans,fontSize:10,color:"#9a9490",lineHeight:1.8}}>Seleccioná al menos un estilo<br/>para generar el set</div>
            </div>
          )}
        </div>

        {/* ── CTA ── */}
        <div style={{background:"rgba(8,7,5,0.97)",borderTop:"1px solid #141210",padding:"10px 14px",flexShrink:0}}>
          <div style={{display:"flex",gap:6}}>
            {canProceed && (
              <button onClick={handleReshuffle}
                style={{
                  padding:"11px 14px",borderRadius:10,border:"1px solid #1c1a18",cursor:"pointer",
                  background:"#0a0906",fontFamily:T.sans,fontWeight:700,fontSize:11,
                  color:"#b0aca8",WebkitTapHighlightColor:"transparent"
                }}
              >⟳</button>
            )}
            <button
              onClick={canBuild ? handleBuild : canProceed ? handleReshuffle : ()=>setStep(0)}
              style={{
                flex:1,padding:"12px 0",borderRadius:10,border:"none",cursor:"pointer",
                background: canBuild ? `linear-gradient(135deg,#1e1608,#0d0b05)` : canProceed ? "#0d0c08" : "#0a0906",
                outline: canBuild ? `1px solid ${T.goldDim}` : canProceed ? `1px solid ${T.goldDim}55` : "1px solid #141210",
                fontFamily:T.sans,fontWeight:800,fontSize:11.5,letterSpacing:0.3,
                color: canBuild ? T.gold : canProceed ? T.goldDim : "#282624",
                transition:"all 0.18s",WebkitTapHighlightColor:"transparent"
              }}
            >
              {!canProceed ? "↑ seleccioná un estilo primero" :
               !canBuild ? "⟳ generar set" :
               `✦ ARMAR SET · ${(preview.tracks.length+1)} tracks`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function BuildScreen({ seed, setSeed, mySet, addToSet, setMySet, maxPop, onFind, djTracks=[] }) {
  const [tab, setTab]               = useState("auto");   // "auto" | "manual"
  const [styleFilter, setStyleFilter] = useState("all");
  const [showInfo, setShowInfo]     = useState(false);
  const [showAutoBuildModal, setShowAutoBuildModal] = useState(false);

  const allTracks = React.useMemo(()=>[...TRACKS,...djTracks],[djTracks]);

  const handleAutoBuild = (newSeed, newTracks) => {
    setSeed(newSeed);
    setMySet(newTracks);
  };

  const availableStyles = React.useMemo(()=>{
    return ["all", ...[...new Set(allTracks.flatMap(t=>t.style))].sort()];
  },[allTracks]);

  // AUTO-BUILD: siempre calculado, sin guard por tab
  const autoTracks = useMemo(()=>{
    if(!seed) return [];
    return autoBuild(seed, styleFilter, maxPop, 30, allTracks);
  },[seed, styleFilter, maxPop, allTracks]);

  // MANUAL: candidatos rankeados
  const recs = useMemo(()=>{
    if(!seed) return [];
    return allTracks
      .filter(t => t.id!==seed.id && (t.isEmergent||t.pop<=maxPop) && matchesStyleFilter(t,styleFilter))
      .map(t => ({...t, scoreData:scoreMatch(seed,t)}))
      .filter(t => t.scoreData.total > 0)
      .sort((a,b) => b.scoreData.total - a.scoreData.total)
      .slice(0,20);
  },[seed, maxPop, styleFilter, allTracks]);

  const handleAddAll = () => {
    const toAdd = autoTracks.filter(t => !mySet.some(s=>s.id===t.id));
    if(toAdd.length > 0) setMySet(prev => [...prev, ...toAdd]);
  };

  if(!seed) return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {showAutoBuildModal && <AutoBuildModal onClose={()=>setShowAutoBuildModal(false)} onBuild={handleAutoBuild} maxPop={maxPop}/>}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px",gap:24}}>
        <div style={{textAlign:"center"}}>
          <LogoMark size={56}/>
          <div style={{fontFamily:T.sans,fontWeight:800,fontSize:15,color:"#a8a4a0",marginTop:16,letterSpacing:-0.3}}>construí tu set</div>
          <div style={{fontFamily:T.sans,fontSize:9.5,color:"#9a9490",lineHeight:1.9,marginTop:6,whiteSpace:"pre-line"}}>{"Elegí un estilo y dejá que Auto Build\narme toda la secuencia por vos.\nO seleccioná una semilla en Library."}</div>
        </div>
        <button
          onClick={()=>setShowAutoBuildModal(true)}
          style={{
            width:"100%",maxWidth:280,padding:"15px 24px",borderRadius:14,
            border:`1px solid ${T.goldDim}`,cursor:"pointer",
            background:"linear-gradient(135deg, #1a1408, #0d0a05)",
            fontFamily:T.sans,fontWeight:800,fontSize:13,
            color:T.gold,letterSpacing:0.3,
            boxShadow:`0 0 30px #c9a84c0a`,
            WebkitTapHighlightColor:"transparent",transition:"all 0.2s"
          }}
        >✦ AUTO BUILD POR ESTILO</button>
        <div style={{display:"flex",alignItems:"center",gap:10,width:"100%",maxWidth:280}}>
          <div style={{flex:1,height:1,background:"#141210"}}/>
          <span style={{fontFamily:T.mono,fontSize:7,color:"#9a9490",letterSpacing:1.5}}>O</span>
          <div style={{flex:1,height:1,background:"#141210"}}/>
        </div>
        <div style={{fontFamily:T.sans,fontSize:9,color:"#a8a4a0",textAlign:"center",lineHeight:1.7}}>
          Seleccioná un track en <span style={{color:"#aca49a"}}>LIBRARY</span> como semilla<br/>y usalo como punto de partida manual.
        </div>
      </div>
    </div>
  );

  const house  = isHouseTrack(seed);
  const accent = house ? HOUSE_ACCENT : T.gold;
  const seedBg = house ? "#080d14" : "#0c0a06";
  const seedBorder = house ? "#1e3040" : "#2a2210";

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {showAutoBuildModal && <AutoBuildModal onClose={()=>setShowAutoBuildModal(false)} onBuild={handleAutoBuild} maxPop={maxPop}/>}

      {/* ── SEED CARD ── */}
      <div style={{margin:"8px 12px 0",background:seedBg,border:`1px solid ${seedBorder}`,borderRadius:14,padding:"12px 15px",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontFamily:T.mono,fontSize:7,color:accent,letterSpacing:2,textTransform:"uppercase",opacity:0.6}}>semilla</span>
          <div style={{display:"flex",gap:5,alignItems:"center"}}>
            <button onClick={()=>setShowAutoBuildModal(true)} style={{background:"#1a1408",border:`1px solid ${T.goldDim}`,color:T.gold,fontSize:7.5,padding:"3px 9px",borderRadius:5,cursor:"pointer",fontFamily:T.sans,fontWeight:700,letterSpacing:0.3,WebkitTapHighlightColor:"transparent"}}>✦ auto build</button>
            <button onClick={()=>setSeed(null)} style={{background:"none",border:`1px solid ${seedBorder}`,color:"#5a4a1a",fontSize:10,width:20,height:20,borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:T.sans}}>✕</button>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:accent,letterSpacing:-0.3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{seed.title}</div>
            <div style={{fontFamily:T.sans,fontSize:9.5,color:house?"#2a5070":"#6a5828",marginTop:2}}>{seed.artist}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              <KeyPill k={seed.key} highlight/>
              <span style={{fontFamily:T.mono,fontSize:9,color:T.textMid}}>{seed.bpm}</span>
            </div>
            <EBar energy={seed.energy} showLabel/>
          </div>
        </div>
      </div>

      {/* ── TAB: AUTO / MANUAL ── */}
      <div style={{margin:"6px 12px 0",display:"flex",background:"#060504",border:"1px solid #141210",borderRadius:10,overflow:"hidden",flexShrink:0}}>
        {[["auto","✦ Auto-Build"],["manual","Manual"]].map(([id,lbl])=>(
          <button
            key={id}
            onClick={()=>setTab(id)}
            style={{
              flex:1, border:"none", padding:"9px 0", cursor:"pointer",
              background: tab===id ? (id==="auto"?"#12100a":"#0e0e0e") : "transparent",
              fontFamily:T.sans, fontWeight:700, fontSize:9.5, letterSpacing:0.5,
              color: tab===id ? (id==="auto"?T.gold:"#888") : "#282624",
              borderRight: id==="auto" ? "1px solid #141210" : "none",
              transition:"all 0.15s", WebkitTapHighlightColor:"transparent"
            }}
          >{lbl}</button>
        ))}
      </div>

      {/* ── FILTRO DE ESTILO ── */}
      <div style={{padding:"6px 12px 0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
          <span style={{fontFamily:T.mono,fontSize:6.5,color:"#a8a4a0",letterSpacing:1.5,textTransform:"uppercase"}}>estilo</span>
          {styleFilter!=="all" && (
            <button onClick={()=>setStyleFilter("all")} style={{background:"#1a1206",border:`1px solid ${T.goldDim}`,color:T.gold,fontFamily:T.mono,fontSize:6.5,padding:"1px 6px",borderRadius:4,cursor:"pointer"}}>✕</button>
          )}
        </div>
        <div style={{display:"flex",gap:3,overflowX:"auto",paddingBottom:3,scrollbarWidth:"none"}}>
          {availableStyles.map(s=>{
            const isHouseStyle = ["dark house","deep house","melodic house","dub house","chicago","ghetto house","dubstep","bass"].includes(s);
            const ac = isHouseStyle ? HOUSE_ACCENT : T.gold;
            const active = styleFilter===s;
            return (
              <button
                key={s}
                onClick={()=>setStyleFilter(s)}
                style={{
                  flexShrink:0, fontSize:7, padding:"3px 9px", borderRadius:20, cursor:"pointer",
                  letterSpacing:0.8, textTransform:"uppercase", fontFamily:T.sans, fontWeight:active?700:400,
                  background: active?`${ac}20`:"transparent",
                  color: active ? ac : "#282624",
                  border: `1px solid ${active?ac:"#1c1a18"}`,
                  transition:"all 0.12s", WebkitTapHighlightColor:"transparent", whiteSpace:"nowrap"
                }}
              >{s==="all"?"todos":s}</button>
            );
          })}
        </div>
      </div>

      {/* ════════════════ AUTO-BUILD ════════════════ */}
      {tab==="auto" && (
        <div style={{flex:1,overflowY:"auto",padding:"6px 10px 100px",scrollbarWidth:"none"}}>
          {autoTracks.length===0 ? (
            <div style={{textAlign:"center",padding:"50px 24px"}}>
              <div style={{fontFamily:T.sans,fontSize:22,marginBottom:10,opacity:0.15}}>◎</div>
              <div style={{fontFamily:T.sans,fontSize:11,fontWeight:600,color:"#a8a4a0",marginBottom:6}}>Sin secuencia posible</div>
              <div style={{fontFamily:T.sans,fontSize:9,color:"#9a9490",lineHeight:1.9}}>
                {styleFilter!=="all" ? `El estilo "${styleFilter}" no tiene tracks compatibles con esta semilla.` : "Subí el límite de popularidad en Library."}
              </div>
            </div>
          ) : (
            <>
              {/* Header */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 2px 6px"}}>
                <span style={{fontFamily:T.mono,fontSize:8,color:T.textGhost}}>{autoTracks.length} tracks · secuencia armada</span>
                <button
                  onClick={handleAddAll}
                  style={{
                    background:"#071507",border:`1px solid ${T.green}40`,color:T.green,
                    fontFamily:T.sans,fontWeight:700,fontSize:8.5,padding:"5px 13px",
                    borderRadius:8,cursor:"pointer",letterSpacing:0.5,WebkitTapHighlightColor:"transparent"
                  }}
                >+ agregar todo al set</button>
              </div>

              {/* Arco de energía */}
              <div style={{background:"#070605",border:"1px solid #141210",borderRadius:10,marginBottom:8,padding:"8px 8px 2px"}}>
                <span style={{fontFamily:T.mono,fontSize:6.5,color:"#a8a4a0",letterSpacing:1.5,textTransform:"uppercase",paddingLeft:4}}>arco de energía</span>
                <EnergyFlowChart tracks={[seed,...autoTracks]}/>
              </div>

              {/* Secuencia */}
              <div style={{display:"flex",flexDirection:"column",gap:0}}>

                {/* Semilla (dimmed) */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:1}}>
                  <span style={{fontFamily:T.mono,fontSize:6.5,color:T.goldDim,width:18,textAlign:"center",flexShrink:0}}>S</span>
                  <div style={{flex:1,background:"#0d0b07",border:`1px solid #221a08`,borderRadius:10,padding:"8px 12px",opacity:0.65}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontFamily:T.sans,fontWeight:700,fontSize:11,color:T.gold}}>{seed.title}</div>
                        <div style={{fontFamily:T.sans,fontSize:8,color:"#4a3a14",marginTop:1}}>{seed.artist}</div>
                      </div>
                      <div style={{display:"flex",gap:5,alignItems:"center"}}>
                        <KeyPill k={seed.key} highlight/>
                        <span style={{fontFamily:T.mono,fontSize:8,color:T.textDim}}>{seed.bpm}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Tracks generados */}
                {autoTracks.map((track,i)=>{
                  const prev   = i===0 ? seed : autoTracks[i-1];
                  const compat = keyCompat(prev.key, track.key);
                  const dBpm   = track.bpm - prev.bpm;
                  const inSet  = mySet.some(s=>s.id===track.id);
                  return (
                    <div key={track.id}>
                      {/* Conector */}

function SetScreen({ mySet, setMySet, onFind }) {
  const moveUp=i=>{if(i===0)return;const a=[...mySet];[a[i-1],a[i]]=[a[i],a[i-1]];setMySet(a);};
  const moveDown=i=>{if(i===mySet.length-1)return;const a=[...mySet];[a[i],a[i+1]]=[a[i+1],a[i]];setMySet(a);};
  const remove=id=>setMySet(p=>p.filter(t=>t.id!==id));
  if(mySet.length===0) return <EmptyState icon={<LogoMark size={56}/>} headline="tu set está vacío" sub={"Explorá LIBRARY para descubrir tracks\ny usá BUILD para encontrar el siguiente\ntrack compatible. Agregá con '+'."}/>; 
  const avgBpm=Math.round(mySet.reduce((a,t)=>a+t.bpm,0)/mySet.length);
  const avgE=(mySet.reduce((a,t)=>a+t.energy,0)/mySet.length).toFixed(1);
  const dur=mySet.length*7;
  let harmSum=0;
  for(let i=1;i<mySet.length;i++) harmSum+=camelotScore(mySet[i-1].key,mySet[i].key);
  const harm=mySet.length>1?Math.round(harmSum/(mySet.length-1)):100;

  return (

          <div key={l} style={{flex:1,padding:"11px 0",textAlign:"center",borderRight:i<arr.length-1?"1px solid #100e0c":"none"}}>

          <div style={{fontFamily:T.sans,fontWeight:700,fontSize:7.5,color:T.textGhost,letterSpacing:1.2,textTransform:"uppercase",marginBottom:5}}>cohesión armónica</div>
          <div style={{height:2,width:150,background:"#141210",borderRadius:2}}>
            <div style={{height:"100%",width:`${harm}%`,background:harmColor,borderRadius:2,transition:"width 0.5s"}}/>

      {mySet.length>=2&&(

function InstallBanner() {
  const [show, setShow] = React.useState(false);
  const [deferredPrompt, setDeferredPrompt] = React.useState(null);
  const [isIOS, setIsIOS] = React.useState(false);
  const [dismissed, setDismissed] = React.useState(false);

  React.useEffect(() => {
    // Ya instalada → no mostrar
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    // Ya descartada antes
    if (localStorage.getItem('setlab_banner_dismissed')) return;

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (ios) { setIsIOS(true); setTimeout(()=>setShow(true), 3000); return; }

    const handler = e => { e.preventDefault(); setDeferredPrompt(e); setTimeout(()=>setShow(true), 3000); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  function dismiss() {
    setShow(false);
    setDismissed(true);
    localStorage.setItem('setlab_banner_dismissed', '1');
  }

  async function install() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') setShow(false);
    }
  }

  if (!show || dismissed) return null;

  return (
    <div style={{
      position:"fixed", bottom:80, left:"50%", transform:"translateX(-50%)",
      width:"calc(100% - 32px)", maxWidth:398, zIndex:300,
      background:"linear-gradient(135deg,#0e0b06,#1a1206)",
      border:`1px solid ${T.gold}44`, borderRadius:16,
      padding:"14px 16px", boxShadow:"0 8px 32px rgba(0,0,0,0.6)",
      animation:"slideUp 0.4s cubic-bezier(.2,0,.2,1)"
    }}>
      <style>{`@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}`}</style>
      <button onClick={dismiss} style={{position:"absolute",top:10,right:12,background:"none",border:"none",color:T.textDim,fontSize:14,cursor:"pointer",padding:2}}>✕</button>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:44,height:44,borderRadius:12,background:"#030302",border:`1px solid ${T.gold}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <LogoMark size={32}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:T.sans,fontWeight:800,fontSize:13,color:T.gold,letterSpacing:-0.3}}>Instalá SetLab</div>
          <div style={{fontFamily:T.sans,fontSize:9.5,color:T.textMid,marginTop:2,lineHeight:1.5}}>
            {isIOS ? "Tocá compartir 􀈂 → \"Agregar a inicio\"" : "Agregá la app a tu pantalla de inicio"}
          </div>
        </div>
        {!isIOS && (
          <button onClick={install} style={{
            background:`${T.gold}18`, border:`1px solid ${T.gold}55`,
            color:T.gold, fontFamily:T.sans, fontWeight:800, fontSize:10,
            padding:"8px 14px", borderRadius:10, cursor:"pointer",
            flexShrink:0, letterSpacing:0.3, WebkitTapHighlightColor:"transparent"
          }}>Instalar</button>
        )}
      </div>
      {isIOS && (
        <div style={{marginTop:10,padding:"8px 12px",background:"#080706",borderRadius:10,border:"1px solid #1e1c18"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>1️⃣</span>
            <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid}}>Tocá el botón <strong style={{color:T.text}}>Compartir</strong> en Safari (ícono de flecha hacia arriba)</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
            <span style={{fontSize:16}}>2️⃣</span>
            <span style={{fontFamily:T.sans,fontSize:9,color:T.textMid}}>Seleccioná <strong style={{color:T.text}}>"Agregar a pantalla de inicio"</strong></span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>

// ── PANTALLA DJS EMERGENTES ───────────────────────────────────────────────
function DJsScreen({ djTracks, setDjTracks, mySet, addToSet }) {
  const [search, setSearch] = React.useState("");
  const [showForm, setShowForm] = React.useState(false);
  const [editTrack, setEditTrack] = React.useState(null);
  const [artistFilter, setArtistFilter] = React.useState(null);

  const artists = React.useMemo(()=>[...new Set(djTracks.map(t=>t.artist))].sort(),[djTracks]);

  const filtered = React.useMemo(()=>djTracks.filter(t=>{
    if(artistFilter && t.artist !== artistFilter) return false;
    if(search){const q=search.toLowerCase();return t.title.toLowerCase().includes(q)||t.artist.toLowerCase().includes(q);}
    return true;
  }),[djTracks,search,artistFilter]);

  function saveTrack(form) {
    if (editTrack) {
      const updated = djTracks.map(t=>t.id===editTrack.id?{...t,...form}:t);
      setDjTracks(updated); saveDjTracks(updated);
    } else {
      const track = {...form, id:newDjId(), pop:5, isEmergent:true, addedAt:Date.now()};
      const updated = [track, ...djTracks];
      setDjTracks(updated); saveDjTracks(updated);
    }
    setShowForm(false); setEditTrack(null);
  }

  function deleteTrack(id) {
    const updated = djTracks.filter(t=>t.id!==id);
    setDjTracks(updated); saveDjTracks(updated);
  }

  function startEdit(track) { setEditTrack(track); setShowForm(true); }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",position:"relative"}}>
      {/* Header info */}
      <div style={{padding:"10px 16px 0",flexShrink:0}}>
        <div style={{background:`${DJ_ACCENT}08`,border:`1px solid ${DJ_ACCENT}20`,borderRadius:12,padding:"10px 14px",marginBottom:8}}>
          <div style={{fontFamily:T.sans,fontSize:9.5,color:T.textMid,lineHeight:1.7}}>
            Agregá tracks de <span style={{color:DJ_ACCENT,fontWeight:700}}>DJs emergentes</span> para cruzarlos con el catálogo y construir sets más frescos. Se guardan en tu dispositivo.
          </div>
        </div>
      </div>
      {/* Search + Add button */}
      <div style={{padding:"0 14px 0",flexShrink:0,display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,background:"#070605",border:"1px solid #181614",borderRadius:10,padding:"8px 12px"}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2a2826" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="buscar artista o track…" style={{flex:1,background:"none",border:"none",outline:"none",fontSize:11.5,color:T.text,fontFamily:T.sans}}/>
          {search&&<button onClick={()=>setSearch("")} style={{background:"none",border:"none",color:"#a8a4a0",cursor:"pointer",fontSize:13,padding:0}}>✕</button>}
        </div>
        <button onClick={()=>{setEditTrack(null);setShowForm(true);}} style={{background:`${DJ_ACCENT}15`,border:`1px solid ${DJ_ACCENT}44`,color:DJ_ACCENT,width:38,height:38,borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700,flexShrink:0,WebkitTapHighlightColor:"transparent",fontFamily:T.sans}}>+</button>
      </div>
      {/* Artist filter chips */}
      {artists.length > 0 && (
        <div style={{padding:"8px 14px 0",flexShrink:0}}>
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none"}}>
            <button onClick={()=>setArtistFilter(null)} style={{flexShrink:0,background:!artistFilter?`${DJ_ACCENT}20`:"transparent",color:!artistFilter?DJ_ACCENT:"#333",border:`1px solid ${!artistFilter?DJ_ACCENT+"55":"#1e1c1a"}`,fontSize:7.5,padding:"4px 10px",borderRadius:20,cursor:"pointer",letterSpacing:1,textTransform:"uppercase",fontFamily:T.sans,fontWeight:!artistFilter?700:400,transition:"all 0.15s",WebkitTapHighlightColor:"transparent"}}>todos</button>
            {artists.map(a=>(
              <button key={a} onClick={()=>setArtistFilter(artistFilter===a?null:a)} style={{flexShrink:0,background:artistFilter===a?`${DJ_ACCENT}20`:"transparent",color:artistFilter===a?DJ_ACCENT:"#333",border:`1px solid ${artistFilter===a?DJ_ACCENT+"55":"#1e1c1a"}`,fontSize:7.5,padding:"4px 10px",borderRadius:20,cursor:"pointer",letterSpacing:1,fontFamily:T.sans,fontWeight:artistFilter===a?700:400,transition:"all 0.15s",WebkitTapHighlightColor:"transparent",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a}</button>
            ))}
          </div>
        </div>
      )}
      {/* Count */}
      <div style={{padding:"6px 16px 4px",display:"flex",justifyContent:"space-between",flexShrink:0}}>
        <span style={{fontFamily:T.mono,fontSize:8.5,color:T.textGhost}}>{filtered.length} tracks emergentes</span>
        {djTracks.length>0&&<span style={{fontFamily:T.mono,fontSize:8.5,color:DJ_ACCENT,opacity:0.6}}>{djTracks.length} en total</span>}
      </div>
      {/* List */}
      <div style={{flex:1,overflowY:"auto",padding:"0 10px 90px",scrollbarWidth:"none"}}>
        {filtered.length===0 && djTracks.length===0 && (
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60%",gap:16,padding:"0 44px",textAlign:"center"}}>
            <div style={{fontSize:36,opacity:0.15}}>🎧</div>
            <div style={{fontFamily:T.sans,fontWeight:700,fontSize:13,color:T.textMid}}>Aún no hay DJs emergentes</div>
            <div style={{fontFamily:T.sans,fontSize:10,color:T.textDim,lineHeight:2}}>Tocá el <span style={{color:DJ_ACCENT,fontWeight:700}}>+</span> para agregar el primer track</div>
          </div>
        )}
        {filtered.length===0 && djTracks.length>0 && (
          <div style={{textAlign:"center",padding:"60px 0",fontFamily:T.sans,fontSize:11,color:"#8a8480"}}>sin resultados</div>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:6,paddingTop:4}}>
          {filtered.map(t=>(
            <DjTrackCard key={t.id} track={t} onAdd={addToSet} inSet={mySet.some(s=>s.id===t.id)} onEdit={startEdit} onDelete={deleteTrack} mySet={mySet}/>
          ))}
        </div>
      </div>
      {/* Form modal */}
      {showForm&&<DjTrackForm onSave={saveTrack} onCancel={()=>{setShowForm(false);setEditTrack(null);}} initial={editTrack}/>}
    </div>
  );
}

function useIsDesktop() {
  const [desk, setDesk] = React.useState(()=>window.innerWidth >= 900);
  React.useEffect(()=>{
    const fn = ()=>setDesk(window.innerWidth>=900);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);
  return desk;
}

function App() {
  const [tab,setTab]=useState("library");
  const [seed,setSeed]=useState(null);
  const [mySet,setMySet]=useState([]);
  const [style,setStyle]=useState("all");
  const [maxPop,setMaxPop]=useState(65);
  const [search,setSearch]=useState("");
  const [findTrack,setFindTrack]=useState(null);
  const [djTracks,setDjTracks]=useState(()=>loadDjTracks());
  const isDesktop = useIsDesktop();

  // ── TEMA Y ESCALA ─────────────────────────────────────────────────────────
  const [theme, setThemeState] = useState(()=>{
    try { return localStorage.getItem("setlab_theme")||"dark"; } catch { return "dark"; }
  });
  const [scale, setScaleState] = useState(()=>{
    try { return parseFloat(localStorage.getItem("setlab_scale")||"1"); } catch { return 1; }
  });
  const [, forceRender] = useState(0);

  function setThemeFn(name) {
    applyTheme(name);
    setThemeState(name);
    forceRender(n=>n+1);
  }
  function setScaleFn(s) {
    setScaleState(s);
    try { localStorage.setItem("setlab_scale", String(s)); } catch {}
  }

  // Aplicar tema guardado al inicio
  React.useEffect(()=>{ applyTheme(theme); },[]);

  const addToSet=t=>{if(!mySet.some(s=>s.id===t.id))setMySet(p=>[...p,t]);};
  const handleSeed=t=>{setSeed(t);if(t)setTab("build");};
  const tabs=[
    {id:"library",label:"Library",badge:null},
    {id:"build",  label:"Build",  badge:null},
    {id:"set",    label:"Set",    badge:mySet.length||null},
    {id:"djs",    label:"DJs",    badge:djTracks.length||null},
  ];

  const screenProps = {
    library: {seed, setSeed:handleSeed, mySet, addToSet, maxPop, setMaxPop, styleFilter:style, setStyleFilter:setStyle, search, setSearch, onFind:setFindTrack, djTracks},
    build:   {seed, setSeed:t=>{setSeed(t);if(!t)setTab("library");}, mySet, addToSet, setMySet, maxPop, onFind:setFindTrack, djTracks},
    set:     {mySet, setMySet, onFind:setFindTrack},
    djs:     {djTracks, setDjTracks, mySet, addToSet},
  };

  const screens = { library:LibraryScreen, build:BuildScreen, set:SetScreen, djs:DJsScreen };
  const ActiveScreen = screens[tab];

  // ── DESKTOP LAYOUT ────────────────────────────────────────────────────────
  if (isDesktop) return (
    <ScaleCtx.Provider value={scale}>
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",zoom:scale}}>
      {/* Top bar FIJO */}
      <div style={{height:56,background:T.bgAlt,borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",padding:"0 32px",gap:24,flexShrink:0,position:"sticky",top:0,zIndex:50,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}}>
        <LogoFull/>
        <div style={{width:1,height:24,background:T.border}}/>
        {/* Desktop nav tabs */}
        <div style={{display:"flex",gap:4,flex:1}}>
          {tabs.map(({id,label,badge})=>{
            const active=tab===id;
            const accent=id==="djs"?DJ_ACCENT:T.gold;
            return (
              <button key={id} onClick={()=>setTab(id)} style={{position:"relative",background:active?`${accent}15`:"transparent",border:`1px solid ${active?accent+"33":"transparent"}`,borderRadius:8,padding:"6px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,WebkitTapHighlightColor:"transparent",transition:"all 0.15s"}}>
                <TabIcon id={id} active={active}/>
                <span style={{fontFamily:T.sans,fontWeight:active?700:500,fontSize:11,color:active?accent:T.textDim,letterSpacing:0.8,textTransform:"uppercase"}}>{label}</span>
                {badge&&<div style={{background:accent,color:"#000",fontFamily:T.sans,fontWeight:800,fontSize:8,minWidth:16,height:16,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{badge}</div>}
              </button>
            );
          })}
        </div>
        <SettingsBar theme={theme} setThemeFn={setThemeFn} scale={scale} setScaleFn={setScaleFn} compact={false}/>
      </div>

      {/* Main content */}
      <div style={{flex:1,display:"flex",maxWidth:1400,width:"100%",margin:"0 auto",padding:"24px 24px 40px",gap:20,alignItems:"flex-start"}}>
        {/* Left column */}
        <div style={{flex:"0 0 520px",minWidth:0,background:T.bgAlt,border:`1px solid ${T.border}`,borderRadius:20,overflow:"hidden",height:"calc(100vh - 56px - 48px)",display:"flex",flexDirection:"column",position:"sticky",top:80}}>
          <ActiveScreen {...screenProps[tab]}/>
        </div>

        {/* Right column */}
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:16}}>

          <div style={{background:T.bgAlt,border:`1px solid ${T.border}`,borderRadius:20,padding:"20px 24px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <div>
                <div style={{fontFamily:T.mono,fontSize:8,color:T.textGhost,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>set actual</div>
                <div style={{fontFamily:T.sans,fontSize:18,fontWeight:800,color:T.text,letterSpacing:-0.5}}>{mySet.length} tracks</div>
              </div>
              {mySet.length>0&&<button onClick={()=>setTab("set")} style={{background:`${T.gold}15`,border:`1px solid ${T.gold}33`,color:T.gold,fontFamily:T.sans,fontWeight:700,fontSize:10,padding:"8px 16px",borderRadius:10,cursor:"pointer",letterSpacing:0.5}}>Ver set completo →</button>}
            </div>
            {mySet.length===0?(
              <div style={{textAlign:"center",padding:"24px 0",fontFamily:T.sans,fontSize:11,color:T.textGhost}}>Agregá tracks desde Library o Build</div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <EnergyFlowChart tracks={mySet}/>
                {mySet.slice(-3).map((t,i)=>(
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:T.surface,border:`1px solid ${T.border}`,borderRadius:10}}>
                    <span style={{fontFamily:T.mono,fontSize:8,color:T.textGhost,width:20,textAlign:"center"}}>{mySet.length-2+i}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:T.sans,fontWeight:700,fontSize:11,color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</div>
                      <div style={{fontFamily:T.sans,fontSize:9,color:T.textDim}}>{t.artist}</div>
                    </div>
                    <KeyPill k={t.key}/>
                    <span style={{fontFamily:T.mono,fontSize:9,color:T.textDim}}>{t.bpm}</span>
                  </div>
                ))}
                {mySet.length>3&&<div style={{textAlign:"center",fontFamily:T.mono,fontSize:8,color:T.textGhost}}>+ {mySet.length-3} más</div>}
              </div>
            )}
          </div>

          {seed&&(
            <div style={{background:T.bgAlt,border:`1px solid ${T.gold}22`,borderRadius:20,padding:"20px 24px"}}>
              <div style={{fontFamily:T.mono,fontSize:8,color:T.goldDim,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>semilla activa</div>
              <div style={{fontFamily:T.sans,fontSize:16,fontWeight:800,color:T.gold,letterSpacing:-0.3,marginBottom:4}}>{seed.title}</div>
              <div style={{fontFamily:T.sans,fontSize:11,color:T.textMid,marginBottom:12}}>{seed.artist}</div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <KeyPill k={seed.key} highlight/>
                <span style={{fontFamily:T.mono,fontSize:11,color:T.textDim}}>{seed.bpm} BPM</span>
                <EBar energy={seed.energy} showLabel/>
              </div>
            </div>
          )}

          {djTracks.length>0&&(
            <div style={{background:T.bgAlt,border:`1px solid ${DJ_ACCENT}18`,borderRadius:20,padding:"20px 24px"}}>
              <div style={{fontFamily:T.mono,fontSize:8,color:DJ_ACCENT,letterSpacing:2,textTransform:"uppercase",opacity:0.7,marginBottom:10}}>djs emergentes</div>
              <div style={{fontFamily:T.sans,fontSize:22,fontWeight:800,color:DJ_ACCENT,marginBottom:4}}>{djTracks.length}</div>
              <div style={{fontFamily:T.sans,fontSize:10,color:T.textDim,marginBottom:12}}>tracks en tu catálogo</div>
              <button onClick={()=>setTab("djs")} style={{background:`${DJ_ACCENT}15`,border:`1px solid ${DJ_ACCENT}33`,color:DJ_ACCENT,fontFamily:T.sans,fontWeight:700,fontSize:10,padding:"8px 16px",borderRadius:10,cursor:"pointer",letterSpacing:0.5}}>Ver DJs →</button>
            </div>
          )}

          <div style={{background:T.bgAlt,border:`1px solid ${T.border}`,borderRadius:20,padding:"20px 24px"}}>
            <div style={{fontFamily:T.mono,fontSize:8,color:"#01ff9544",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>beatport affiliate</div>
            <div style={{fontFamily:T.sans,fontSize:11,color:T.textDim,lineHeight:1.8}}>
              Cada click en <span style={{color:"#01ff95",fontWeight:700}}>B</span> genera una comisión cuando el usuario compra. Configurá tu ID en el código para activarlo.
            </div>
            <div style={{marginTop:12,fontFamily:T.mono,fontSize:9,color:T.textGhost,background:T.surface,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px"}}>
              const BP_AFFIL = <span style={{color:"#01ff95"}}>"tu-id-aqui"</span>;
            </div>
          </div>
        </div>
      </div>
      {findTrack&&<FindModal track={findTrack} onClose={()=>setFindTrack(null)}/>}
      <InstallBanner/>
    </div>
    </ScaleCtx.Provider>
  );

  // ── MOBILE LAYOUT — header y footer siempre visibles ──────────────────────
  const HEADER_H = env_safe_area_top() + 52; // 44 safe area + 52 header
  const NAV_H = 64;
  return (
    <ScaleCtx.Provider value={scale}>
    <div style={{height:"100vh",overflow:"hidden",background:T.bg,position:"relative"}}>

      {/* HEADER FIJO — siempre visible */}
      <div style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:T.bgAlt,borderBottom:`1px solid ${T.border}`}}>
        <div style={{height:env_safe_area_top()}}/>
        <div style={{height:52,display:"flex",alignItems:"center",padding:"0 14px 0 20px",justifyContent:"space-between",maxWidth:430,margin:"0 auto",width:"100%"}}>
          <LogoFull/>
          <SettingsBar theme={theme} setThemeFn={setThemeFn} scale={scale} setScaleFn={setScaleFn} compact={true}/>
        </div>
      </div>

      {/* CONTENIDO SCROLLABLE — entre header y nav */}
      <div style={{
        position:"absolute", top:HEADER_H, bottom:NAV_H, left:0, right:0,
        overflowY:"auto", overflowX:"hidden",
        WebkitOverflowScrolling:"touch", scrollbarWidth:"none",
      }}>
        <div style={{zoom:scale, maxWidth:430, margin:"0 auto", minHeight:"100%", background:T.bgAlt, display:"flex", flexDirection:"column"}}>
          {tab==="library"&&<LibraryScreen seed={seed} setSeed={handleSeed} mySet={mySet} addToSet={addToSet} maxPop={maxPop} setMaxPop={setMaxPop} styleFilter={style} setStyleFilter={setStyle} search={search} setSearch={setSearch} onFind={setFindTrack} djTracks={djTracks}/>}
          {tab==="build"&&<BuildScreen seed={seed} setSeed={t=>{setSeed(t);if(!t)setTab("library");}} mySet={mySet} addToSet={addToSet} setMySet={setMySet} maxPop={maxPop} onFind={setFindTrack} djTracks={djTracks}/>}
          {tab==="set"&&<SetScreen mySet={mySet} setMySet={setMySet} onFind={setFindTrack}/>}
          {tab==="djs"&&<DJsScreen djTracks={djTracks} setDjTracks={setDjTracks} mySet={mySet} addToSet={addToSet}/>}
        </div>
      </div>

      {/* NAV INFERIOR FIJA — siempre visible */}
      <div style={{
        position:"fixed", bottom:0, left:0, right:0, zIndex:100,
        background:T.isDark?"rgba(4,3,2,0.97)":T.bgAlt,
        borderTop:`1px solid ${T.border}`,
        display:"flex", paddingBottom:"env(safe-area-inset-bottom,8px)",
        backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
      }}>
        <div style={{display:"flex",width:"100%",maxWidth:430,margin:"0 auto"}}>
          {tabs.map(({id,label,badge})=>{
            const active=tab===id;
            const accent=id==="djs"?DJ_ACCENT:T.gold;
            return (
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",position:"relative",WebkitTapHighlightColor:"transparent",padding:"10px 0"}}>
                {active&&<div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:20,height:1.5,background:accent,borderRadius:"0 0 2px 2px"}}/>}
                <TabIcon id={id} active={active}/>
                <span style={{fontFamily:T.sans,fontWeight:active?700:500,fontSize:7.5,color:active?accent:T.textGhost,letterSpacing:1.2,textTransform:"uppercase"}}>{label}</span>
                {badge&&<div style={{position:"absolute",top:5,right:"calc(50% - 20px)",background:accent,color:"#000",fontFamily:T.sans,fontWeight:800,fontSize:7,width:14,height:14,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{badge}</div>}
              </button>
            );
          })}
        </div>
      </div>

      {findTrack&&<FindModal track={findTrack} onClose={()=>setFindTrack(null)}/>}
      <InstallBanner/>
    </div>
    </ScaleCtx.Provider>
  );
}

function env_safe_area_top() { return 44; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ── PWA: MANIFEST INLINE ──────────────────────────────────────────────────
(function(){
  const manifest = {
    name: "SetLab — DJ Set Planner",
    short_name: "SetLab",
    description: "Planeá tus sets de DJ con compatibilidad armónica y energía",
    start_url: "./",
    display: "standalone",
    background_color: "#030302",
    theme_color: "#030302",
    orientation: "portrait",
    icons: [
      { src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%23030302'/%3E%3Ccircle cx='256' cy='256' r='200' fill='none' stroke='%23c9a84c' stroke-width='12'/%3E%3Ccircle cx='256' cy='256' r='140' fill='none' stroke='%23c9a84c' stroke-width='6' opacity='.4'/%3E%3Ccircle cx='256' cy='256' r='80' fill='%23c9a84c' opacity='.25'/%3E%3Ccircle cx='256' cy='256' r='28' fill='%23c9a84c'/%3E%3C/svg%3E", sizes:"512x512", type:"image/svg+xml", purpose:"any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  document.getElementById("pwa-manifest").href = URL.createObjectURL(blob);
})();

// ── PWA: SERVICE WORKER ───────────────────────────────────────────────────
if('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'setlab-v1';
const ASSETS = ['./', './index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
`;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).then(()=>{
    console.log('[SetLab] PWA lista — instalable desde el navegador');
  }).catch(()=>{});
}
</script>
