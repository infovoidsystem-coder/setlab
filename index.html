<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SetLab"/>
<title>SetLab — DJ Set Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;--gold2:#7a6230;
  --bg:#030302;--bg2:#0a0906;--bg3:#111009;
  --border:#1c1a17;--border2:#2a2720;
  --text:#e8e2d9;--text2:#a09890;--text3:#706860;--text4:#403c38;
  --green:#22c55e;--lime:#84cc16;--yellow:#eab308;--orange:#f97316;--red:#ef4444;
  --sans:"Syne",sans-serif;--mono:"DM Mono",monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;-webkit-appearance:none}
input,select,textarea{font-family:var(--mono);outline:none;border:none;-webkit-appearance:none;background:none}
::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{padding-top:var(--safe-top);background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
#header-inner{height:52px;display:flex;align-items:center;padding:0 14px 0 16px;gap:10px}
#logo{display:flex;align-items:center;gap:8px;flex:1}
#logo-name{font-size:17px;font-weight:800;letter-spacing:-0.5px;color:var(--gold);line-height:1}
#logo-sub{font-family:var(--mono);font-size:6.5px;letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;margin-top:1px}
#header-actions{display:flex;gap:4px;align-items:center}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#nav{padding-bottom:var(--safe-bot);background:rgba(3,3,2,0.97);border-top:1px solid var(--border);flex-shrink:0;display:flex;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0;position:relative;border:none;background:none}
.nav-label{font-size:7.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text4);font-weight:600;font-family:var(--sans)}
.nav-btn.active .nav-label{color:var(--gold)}
.nav-dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:1.5px;background:var(--gold);border-radius:0 0 2px 2px;opacity:0}
.nav-btn.active .nav-dot{opacity:1}
.nav-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--gold);color:#000;font-size:7px;font-weight:800;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--sans)}

/* SCREENS */
.screen{display:none;padding:14px;max-width:480px;margin:0 auto;min-height:100%;padding-bottom:20px}
.screen.active{display:block}

/* TRACK CARDS */
.track-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;transition:border-color 0.15s}
.track-card.selected{border-color:var(--gold)88;background:var(--bg3)}
.track-card.in-set{border-color:#22c55e33}
.track-info{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.key-pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid;font-weight:500;flex-shrink:0}
.bpm-tag{font-family:var(--mono);font-size:9px;color:var(--text3)}
.style-tag{font-family:var(--mono);font-size:8px;color:var(--text4);background:var(--border);padding:1px 5px;border-radius:4px}
.ebar{display:flex;gap:1.5px;align-items:center}
.ebar-dot{width:4px;height:4px;border-radius:50%;background:var(--border2)}
.ebar-dot.on{background:var(--gold)}
.compat-badge{font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:20px;border:1px solid;flex-shrink:0}
.score-bar{height:2px;background:var(--border2);border-radius:2px;margin-top:6px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;background:var(--gold)}

/* ACTIONS */
.btn-add{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);color:var(--text3);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;line-height:1}
.btn-add.added{border-color:#22c55e55;color:#22c55e;background:#22c55e11}
.btn-remove{width:26px;height:26px;border-radius:50%;border:1px solid var(--red)44;color:var(--red);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.8}
.btn-icon{padding:6px 10px;border-radius:8px;border:1px solid var(--border2);color:var(--text3);font-size:10px;letter-spacing:0.5px;font-family:var(--sans);font-weight:600}
.btn-primary{padding:10px 16px;border-radius:12px;border:1px solid var(--gold)44;color:var(--gold);font-size:11px;font-weight:700;background:var(--gold)11;font-family:var(--sans);letter-spacing:0.3px}
.btn-danger{padding:8px 14px;border-radius:10px;border:1px solid var(--red)44;color:var(--red);font-size:11px;font-weight:700;background:var(--red)11;font-family:var(--sans)}
.btn-secondary{padding:9px 14px;border-radius:11px;border:1px solid var(--border2);color:var(--text2);font-size:11px;font-weight:600;font-family:var(--sans)}
.btn-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* SEARCH + FILTERS */
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:10px 14px 10px 36px;color:var(--text);font-size:13px}
.search-input::placeholder{color:var(--text4)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:12px;pointer-events:none}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:2px;scrollbar-width:none}
.filter-chip{font-family:var(--mono);font-size:9px;white-space:nowrap;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);flex-shrink:0;text-transform:lowercase}
.filter-chip.active{border-color:var(--gold);color:var(--gold);background:#c9a84c11}

/* SECTION HEADER */
.s-header{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.s-header::after{content:"";flex:1;height:1px;background:var(--border)}

/* SEED CARD */
.seed-card{background:var(--bg3);border:1px solid var(--gold)33;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.seed-lbl{font-family:var(--mono);font-size:8px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.seed-title{font-size:16px;font-weight:800;color:var(--gold);line-height:1.2}
.seed-artist{font-size:11px;color:var(--text2);margin-top:3px}

/* SET ITEMS */
.set-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.set-num{font-family:var(--mono);font-size:10px;color:var(--text4);width:20px;text-align:center;flex-shrink:0}
.set-info{flex:1;min-width:0}
.set-title{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-artist{font-size:9px;color:var(--text3)}
.compat-row{display:flex;align-items:center;gap:6px;padding:1px 8px;margin:2px 0}
.compat-line{flex:1;height:1px;background:var(--border)}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px}
.stat-val{font-size:22px;font-weight:800;color:var(--gold);font-family:var(--sans)}
.stat-lbl{font-family:var(--mono);font-size:7.5px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* ENERGY CHART */
.energy-chart{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;overflow:hidden}
.energy-bars{display:flex;align-items:flex-end;gap:3px;height:40px}
.e-bar{flex:1;border-radius:2px 2px 0 0;min-width:6px;transition:height 0.3s}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:28px;margin-bottom:10px;opacity:0.5}
.empty-text{font-size:12px;line-height:1.7}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:20px 18px 0;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(var(--safe-bot) + 20px)}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-handle{width:32px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:16px;font-weight:800;margin-bottom:2px}
.modal-artist{font-size:11px;color:var(--text3);margin-bottom:14px}
.link-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--border);margin-bottom:7px}
.link-row:active{background:var(--bg3)}
.link-icon{font-size:14px;width:22px;text-align:center;flex-shrink:0}
.link-label{font-size:13px;font-weight:700}
.link-hint{font-size:9px;color:var(--text3);margin-top:1px;font-family:var(--mono)}

/* DJ SCREEN */
.dj-form{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:16px;margin-bottom:12px}
.form-row{margin-bottom:10px}
.form-label{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--mono)}
.form-input:focus{border-color:var(--gold)66}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dj-track-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.dj-actions{display:flex;gap:4px}
.dj-action-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--border2);font-size:9px;color:var(--text3);font-family:var(--mono)}

/* SETTINGS */
.settings-bar{display:flex;gap:6px;align-items:center}
.theme-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);color:var(--text3);font-size:12px;display:flex;align-items:center;justify-content:center}

/* BUILD ADVANCED MODAL */
.advanced-section{margin-bottom:14px}
.adv-title{font-weight:700;font-size:13px;margin-bottom:8px}
.range-wrap{display:flex;align-items:center;gap:10px;margin-top:4px}
.range-val{font-family:var(--mono);font-size:11px;color:var(--gold);min-width:30px;text-align:right}
input[type=range]{-webkit-appearance:none;width:100%;height:2px;border-radius:1px;background:var(--border2);outline:none;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer}
.checkbox-row input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px}
.checkbox-label{font-size:12px}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp 0.2s ease both}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-inner">
      <div id="logo">
        <svg width="26" height="26" viewBox="0 0 44 44" fill="none">
          <circle cx="22" cy="22" r="20" fill="#080806" stroke="#c9a84c" stroke-width="0.6" opacity="0.6"/>
          <circle cx="22" cy="22" r="14" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.35"/>
          <circle cx="22" cy="22" r="8.5" fill="#1a1608" stroke="#c9a84c" stroke-width="1"/>
          <circle cx="22" cy="22" r="2.5" fill="#c9a84c"/>
          <line x1="36" y1="9" x2="26.5" y2="27.5" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
          <circle cx="36" cy="9" r="2" fill="#c9a84c" opacity="0.7"/>
        </svg>
        <div>
          <div id="logo-name">SET<span style="font-weight:300;letter-spacing:4px;color:#aca49a;margin-left:2px">LAB</span></div>
          <div id="logo-sub">DJ Set Planner</div>
        </div>
      </div>
      <div id="header-actions">
        <button class="theme-btn" onclick="toggleTheme()" title="Tema">☀</button>
      </div>
    </div>
  </div>

  <div id="content">
    <div id="screen-library" class="screen active">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="lib-search" type="search" placeholder="Track o artista..." autocomplete="off" autocorrect="off" spellcheck="false"/>
      </div>
      <div class="filter-row" id="lib-filters"></div>
      <div id="pop-filter-row" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px">
        <span style="font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:1px;white-space:nowrap">POP MAX</span>
        <input type="range" id="pop-slider" min="10" max="100" value="100" style="flex:1"/>
        <span id="pop-val" style="font-family:var(--mono);font-size:10px;color:var(--gold);min-width:28px;text-align:right">100</span>
      </div>
      <div id="lib-list"></div>
    </div>

    <div id="screen-build" class="screen">
      <div id="build-content"></div>
    </div>

    <div id="screen-set" class="screen">
      <div id="set-content"></div>
    </div>

    <div id="screen-djs" class="screen">
      <div id="djs-content"></div>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn active" data-tab="library" onclick="switchTab('library')">
      <div class="nav-dot"></div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="nav-label">Library</span>
    </button>
    <button class="nav-btn" data-tab="build" onclick="switchTab('build')">
      <div class="nav-dot"></div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="nav-label">Build</span>
    </button>
    <button class="nav-btn" data-tab="set" onclick="switchTab('set')">
      <div class="nav-dot"></div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="nav-label">Set</span>
      <div class="nav-badge" id="badge-set" style="display:none">0</div>
    </button>
    <button class="nav-btn" data-tab="djs" onclick="switchTab('djs')">
      <div class="nav-dot"></div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      <span class="nav-label">DJs</span>
      <div class="nav-badge" id="badge-djs" style="display:none">0</div>
    </button>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-find" onclick="if(event.target===this)closeModal('find')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div id="modal-find-content"></div>
  </div>
</div>
<div class="modal-overlay" id="modal-build-adv" onclick="if(event.target===this)closeModal('build-adv')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div id="modal-build-adv-content"></div>
  </div>
</div>

// ─── SCORING LOGIC ────────────────────────────────────────────
function camelotScore(a, b) {
  const nA=parseInt(a), nB=parseInt(b), lA=a.slice(-1), lB=b.slice(-1);
  if(nA===nB&&lA===lB) return 100; // mismo — perfecto
  if(nA===nB) return 75;           // relativo mayor/menor
  const d=Math.min(Math.abs(nA-nB),12-Math.abs(nA-nB));
  if(d===1&&lA===lB) return 90;   // adyacente mismo modo
  if(d===1&&lA!==lB) return 50;   // adyacente cruzado
  if(d===2&&lA===lB) return 30;   // salto de 2 mismo modo
  if(d===2&&lA!==lB) return 15;   // salto de 2 cruzado
  if(d===3&&lA===lB) return 10;   // salto de 3 — arriesgado
  if(d===3&&lA!==lB) return 5;
  return 2;                        // > 3 — muy arriesgado pero no cero (no bloquear autobuild)
}
// styleCompatScore: calcula compatibilidad de estilos usando STYLE_FAMILY
function styleCompatScore(stylesA, stylesB) {
  // Match directo
  for (const s of stylesA) {
    if (stylesB.includes(s)) return 45;
  }
  // Match por familia de estilos
  for (const s of stylesA) {
    const familyA = STYLE_FAMILY[s] || [s];
    for (const t of stylesB) {
      const familyB = STYLE_FAMILY[t] || [t];
      if (familyA.some(f => familyB.includes(f))) return 30;
    }
  }
  return 10;
}

// scoreMatch: solo bloquea si BPM completamente incompatible (>16 BPM de diferencia)
function scoreMatch(seed, t) {
  const d = Math.abs(seed.bpm - t.bpm);
  const bpmScore = d===0?100:d<=2?95:d<=4?85:d<=7?65:d<=12?35:d<=15?10:0;
  const keyScore = camelotScore(seed.key, t.key); // nunca 0
  const eDiff = t.energy - seed.energy;
  const energyScore = eDiff===0?90:eDiff===1?100:eDiff===-1?80:eDiff===2?70:eDiff===-2?60:eDiff===3?50:eDiff===-3?30:10;
  const styleScore = styleCompatScore(seed.style, t.style);
  if(bpmScore===0) return {total:0,bpmScore,keyScore,energyScore,styleScore};
  const popBonus = t.pop > seed.pop + 5 ? 8 : 0;
  const total = bpmScore + keyScore + energyScore + styleScore + popBonus;
  return {total,bpmScore,keyScore,energyScore,styleScore};
}
function keyCompat(a, b) {
  const s=camelotScore(a,b);
  if(s===100) return {label:"PERFECTO", color:CSS_GREEN, desc:"Misma clave — transición inaudible"};
  if(s>=90)   return {label:"ARMÓNICO", color:CSS_LIME,  desc:"Adyacente mismo modo — fluye"};
  if(s>=75)   return {label:"MODAL",    color:CSS_YELLOW,desc:"Relativo mayor/menor"};
  if(s>=50)   return {label:"TENSIÓN",  color:CSS_ORANGE,desc:"Adyacente cruzado — atrevido"};
  if(s>=15)   return {label:"SALTO",    color:"#f97316",desc:"Salto de 2–3 — requiere habilidad"};
  return             {label:"CHOQUE",   color:CSS_RED,   desc:"Evitar o usar con intención"};
}
function isHouseTrack(track) {
  return track.style.some(s=>["dark house","deep house","dub house","chicago","ghetto house","bass","dub"].includes(s));
}

// ─── STYLE FILTER ─────────────────────────────────────────────
function matchesStyleFilter(track, styleFilter) {
  if(styleFilter==="all") return true;
  if(track.style.includes(styleFilter)) return true;
  // Buscar en todas las familias que contengan el filtro elegido
  for(const [fam, members] of Object.entries(STYLE_FAMILY)) {
    if(members.includes(styleFilter) && track.style.some(s=>members.includes(s))) return true;
    if(fam===styleFilter && track.style.some(s=>members.includes(s))) return true;
  }
  return false;
}

// ─── AUTO BUILD ───────────────────────────────────────────────
function autoBuild(seed, styleFilter, maxPop, maxTracks=8, allTracks=TRACKS) {
  const pool = allTracks.filter(t =>
    t.id !== seed.id &&
    (t.isEmergent || t.pop <= maxPop) &&
    matchesStyleFilter(t, styleFilter)
  );

  const sequence = [seed];
  const used = new Set([seed.id]);

  for(let step = 0; step < maxTracks - 1; step++) {
    const last = sequence[sequence.length - 1];
    const setStyles = sequence.flatMap(x => x.style);

    const scored = pool
      .filter(t => !used.has(t.id))
      .map(t => {
        const sc = scoreMatch(last, t);

        // Penaliza drift total de BPM respecto al seed
        const bpmDrift = Math.abs(t.bpm - seed.bpm);
        const driftPenalty = bpmDrift > 18 ? -60 : bpmDrift > 12 ? -25 : bpmDrift > 8 ? -10 : 0;

        // Bonus cohesión: el estilo ya apareció en el set
        const cohesionBonus = t.style.filter(s => setStyles.includes(s)).length * 12;

        // Bonus narrativa: leve preferencia a subir energía en primeros pasos, bajar al final
        const progress = step / (maxTracks - 2);
        const eDiff = t.energy - last.energy;
        const narrativeBonus = progress < 0.5 ? (eDiff === 1 ? 15 : eDiff === 0 ? 5 : -5)
                                               : (eDiff === -1 ? 10 : eDiff === 0 ? 5 : -5);

        return {
          ...t,
          scoreData: sc,
          rawTotal: sc.total,
          adjustedTotal: sc.total + driftPenalty + cohesionBonus + narrativeBonus
        };
      })
      .filter(t => t.rawTotal > 0)  // solo descartar si BPM o key son 0
      .sort((a, b) => b.adjustedTotal - a.adjustedTotal);

    if(scored.length === 0) break;

    // Umbral adaptativo: intenta >120 primero, luego baja si no hay
    const best = scored.find(t => t.adjustedTotal >= 120)
               || scored.find(t => t.adjustedTotal >= 80)
               || scored[0];

    sequence.push(best);
    used.add(best.id);
  }

  return sequence.slice(1); // sin la semilla
}

function autoBuildAdvanced(opts) {
  var styles = opts.styles;
  var arcKey = opts.arc;
  var length = opts.length;
  var maxPop = opts.maxPop;
  var variation = opts.variation;

  var pool = TRACKS.filter(function(t) {
    if (t.pop > maxPop) return false;
    for (var si = 0; si < styles.length; si++) {
      if (matchesStyleFilter(t, styles[si])) return true;
    }
    return false;
  });
  if (pool.length === 0) return { seed: null, tracks: [] };

  var arcFn = (ENERGY_ARCS[arcKey] && ENERGY_ARCS[arcKey].fn) ? ENERGY_ARCS[arcKey].fn : ENERGY_ARCS.buildup.fn;
  var seedETarget = arcFn(0, 0);

  var seedPool = pool.slice().sort(function(a, b) {
    var aDiff = Math.abs(a.energy - seedETarget);
    var bDiff = Math.abs(b.energy - seedETarget);
    var nz = variation * 2.5;
    return (aDiff + Math.random() * nz) - (bDiff + Math.random() * nz);
  });

  var chosenSeed = seedPool[0];
  var sequence = [chosenSeed];
  var usedIds = {};
  usedIds[chosenSeed.id] = true;

  var denom = length > 1 ? length - 1 : 1;

  for (var step = 0; step < length - 1; step++) {
    var progress = (step + 1) / denom;
    var targetE = arcFn(progress, step + 1);
    var last = sequence[sequence.length - 1];

    var usedStylesArr = [];
    for (var si2 = 0; si2 < sequence.length; si2++) {
      for (var si3 = 0; si3 < sequence[si2].style.length; si3++) {
        usedStylesArr.push(sequence[si2].style[si3]);
      }
    }

    var recentArtists = [];
    for (var ri = Math.max(0, sequence.length - 3); ri < sequence.length; ri++) {
      recentArtists.push(sequence[ri].artist);
    }

    var candidates = [];
    for (var ci = 0; ci < pool.length; ci++) {
      var t = pool[ci];
      if (usedIds[t.id]) continue;

      var bpmDiff = Math.abs(t.bpm - last.bpm);
      var bpmScore = bpmDiff===0?100:bpmDiff<=2?95:bpmDiff<=4?85:bpmDiff<=7?65:bpmDiff<=12?35:bpmDiff<=16?15:5;
      var keyScore = camelotScore(last.key, t.key);
      var eDiff = Math.abs(t.energy - targetE);
      var arcBonus = eDiff===0?40:eDiff===1?20:eDiff===2?0:-20*(eDiff-2);

      var cohesion = 0;
      for (var csi = 0; csi < t.style.length; csi++) {
        if (usedStylesArr.indexOf(t.style[csi]) >= 0) cohesion += 10;
      }

      var totalDrift = Math.abs(t.bpm - chosenSeed.bpm);
      var driftPenalty = totalDrift > 18 ? -50 : totalDrift > 12 ? -20 : totalDrift > 8 ? -8 : 0;
      var randNoise = (Math.random() - 0.5) * variation * 40;
      var artistPenalty = recentArtists.indexOf(t.artist) >= 0 ? -35 : 0;
      var score = bpmScore + keyScore + arcBonus + cohesion + driftPenalty + randNoise + artistPenalty;

      candidates.push({ track: t, score: score });
    }

    if (candidates.length === 0) break;
    candidates.sort(function(a, b) { return b.score - a.score; });
    var best = candidates[0].track;
    sequence.push(best);
    usedIds[best.id] = true;
  }

  return { seed: chosenSeed, tracks: sequence.slice(1) };
}

}
function ebarH(e) {
  var h = '<div class="ebar">';

  var pct = Math.min(100, total/350*100);
  if(pct>=80) return 'var(--green)';
  if(pct>=60) return 'var(--lime)';
  if(pct>=40) return 'var(--yellow)';

}

  var selected = ST.seed && ST.seed.id===t.id;
  var added = opts.fromDj ? inSet(t.id) : inSet(t.id);
  var cls = 'track-card anim'+(selected?' selected':'')+(added?' in-set':'');
  var delay = (opts.idx||0)*0.03;

    scoreH = '<div class="score-bar"><div class="score-fill" style="width:'+pct+'%;background:'+c2+'"></div></div>';
  }
  var compatStr = '';
  if(opts.prevKey) compatStr = compatH(opts.prevKey, t.key);

  return '<div class="'+cls+'" style="animation-delay:'+delay+'s" data-id="'+t.id+'">'
    + '<div class="track-info" onclick="onTrackTap('+t.id+')">'

function toggleAdvStyle(btn, s) {
  btn.classList.toggle('active');
}
function setAdvVar(btn, v) {
  document.querySelectorAll('.adv-var').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}
function setAdvArc(btn, a) {
  document.querySelectorAll('.adv-arc').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function doBuildAdvanced() {
  var styles = Array.from(document.querySelectorAll('.adv-style.active')).map(function(b){return b.dataset.s;});
  if(!styles.length) styles = ['techno'];
  var arc = (document.querySelector('.adv-arc.active')||{dataset:{a:'random'}}).dataset.a;
  var variation = (document.querySelector('.adv-var.active')||{dataset:{v:'medium'}}).dataset.v;
  var length = parseInt(document.getElementById('adv-len').value)||8;
  var maxPop = parseInt(document.getElementById('adv-pop').value)||65;

  ST.advOpts = {styles, arc, length, maxPop, variation};

  var pool = TRACKS.concat(ST.djTracks);
  var result = autoBuildAdvanced({styles, arc, length, maxPop, variation, allTracks: pool});
  if(result && result.seed) {
    ST.seed = result.seed;
    ST.buildResult = result;
    ST.mySet = [result.seed].concat(result.tracks);
    ST.suggestions = pool.filter(function(t){return t.id!==result.seed.id;})
      .map(function(t){return {track:t,score:scoreMatch(result.seed,t)};})
      .filter(function(x){return x.score.total>0;})
      .sort(function(a,b){return b.score.total-a.score.total;})
      .slice(0,20);
    updateBadges();
    closeModal('build-adv');
    switchTab('build');
  } else {
    alert('No se pudo generar un set con esos parámetros. Probá otros estilos.');
  }
}

// ─── ACTIONS ──────────────────────────────────────────────────
function switchTab(tab) {
  ST.tab = tab;
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
  document.getElementById('content').scrollTop = 0;
  if(tab==='build') renderBuild();
  if(tab==='set') renderSet();
  if(tab==='djs') renderDjs();
}

function onTrackTap(id) {
  // Get track from either pool
  var t = TRACKS.find(function(x){return x.id==id;}) || ST.djTracks.find(function(x){return x.id==id;});
  if(!t) return;
  if(ST.seed && ST.seed.id===t.id) {
    ST.seed = null; ST.suggestions = []; ST.buildResult = null;
  } else {
    ST.seed = t;
    var pool = TRACKS.concat(ST.djTracks);
    ST.suggestions = pool.filter(function(x){return x.id!==t.id;})
      .map(function(x){return {track:x, score:scoreMatch(t,x)};})
      .filter(function(x){return x.score.total>0;})
      .sort(function(a,b){return b.score.total-a.score.total;})
      .slice(0,25);
    ST.buildResult = null;
    switchTab('build');
  }
  if(ST.tab==='library') renderLibrary();
}

function toggleSet(id) {
  var t = TRACKS.find(function(x){return x.id==id;}) || ST.djTracks.find(function(x){return x.id==id;});
  if(!t) return;
  if(inSet(t.id)) {
    ST.mySet = ST.mySet.filter(function(x){return x.id!==t.id;});
  } else {
    ST.mySet.push(t);
  }
  updateBadges();
  if(ST.tab==='library') renderLibrary();
  if(ST.tab==='build') renderBuild();
  if(ST.tab==='set') renderSet();
  if(ST.tab==='djs') renderDjs();
}

function removeFromSet(id) {
  ST.mySet = ST.mySet.filter(function(x){return x.id!==id;});
  updateBadges(); renderSet();
}

function clearSet() {
  if(ST.mySet.length && !confirm('¿Vaciar el set completo?')) return;
  ST.mySet = []; updateBadges(); renderSet();
}

function updateBadges() {
  var bs = document.getElementById('badge-set');
  bs.textContent = ST.mySet.length;
  bs.style.display = ST.mySet.length ? 'flex' : 'none';
  var bd = document.getElementById('badge-djs');
  bd.textContent = ST.djTracks.length;
  bd.style.display = ST.djTracks.length ? 'flex' : 'none';
}

function setLibStyle(s) {
  ST.styleFilter = s;
  renderLibFilters();
  renderLibrary();
}

function doBuildAuto() {
  if(!ST.seed) return;
  var pool = TRACKS.concat(ST.djTracks);
  var built = autoBuild(ST.seed, ST.styleFilter, ST.maxPop, 8, pool);
  ST.mySet = [ST.seed].concat(built);
  ST.buildResult = {seed: ST.seed, tracks: built};
  updateBadges();
  renderBuild();
}

function addBuildToSet() {
  if(!ST.buildResult) return;
  switchTab('set');
}

function showDjForm() { ST.showDjForm = true; ST.editDjId = null; renderDjs(); }
function cancelDjForm() { ST.showDjForm = false; ST.editDjId = null; renderDjs(); }
function editDjTrack(id) { ST.editDjId = id; ST.showDjForm = true; renderDjs(); }

function toggleDjStyle(btn) { btn.classList.toggle('active'); }

function saveDjTrackForm() {
  var title = (document.getElementById('dj-title').value||'').trim();
  var artist = (document.getElementById('dj-artist').value||'').trim();
  var bpm = parseInt(document.getElementById('dj-bpm').value)||128;
  var key = (document.getElementById('dj-key').value||'8A').trim();
  var energy = parseInt(document.getElementById('dj-energy').value)||7;
  var label = (document.getElementById('dj-label').value||'').trim();
  var styles = Array.from(document.querySelectorAll('.dj-form .filter-chip.active')).map(function(b){return b.dataset.style;}).filter(Boolean);
  if(!styles.length) styles = ['techno'];
  if(!title || !artist) { alert('Completá título y artista'); return; }
  if(ST.editDjId) {
    var idx = ST.djTracks.findIndex(function(t){return t.id===ST.editDjId;});
    if(idx>=0) ST.djTracks[idx] = Object.assign(ST.djTracks[idx], {title,artist,bpm,key,energy,style:styles,label,isEmergent:true});
  } else {
    ST.djTracks.push({id:'dj_'+Date.now(),title,artist,bpm,key,energy,style:styles,label,pop:0,isEmergent:true});
  }
  try{ localStorage.setItem('sl_djtracks', JSON.stringify(ST.djTracks)); }catch{}
  ST.showDjForm = false; ST.editDjId = null;
  updateBadges(); renderDjs();
}

function deleteDjTrack(id) {
  if(!confirm('¿Eliminar este track?')) return;
  ST.djTracks = ST.djTracks.filter(function(t){return t.id!==id;});
  ST.mySet = ST.mySet.filter(function(t){return t.id!==id;});
  try{ localStorage.setItem('sl_djtracks', JSON.stringify(ST.djTracks)); }catch{}
  updateBadges(); renderDjs();
}
