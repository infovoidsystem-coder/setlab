<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SetLab Diagnóstico</title>
<style>
  body { background: #030302; color: #e8e2d9; font-family: monospace; padding: 20px; }
  .ok { color: #22c55e; }
  .err { color: #ef4444; }
  .step { margin: 8px 0; font-size: 14px; }
</style>
</head>
<body>
<div id="log"></div>
<script>
var log = document.getElementById('log');
function ok(msg) { log.innerHTML += '<div class="step ok">✓ ' + msg + '</div>'; }
function err(msg) { log.innerHTML += '<div class="step err">✗ ' + msg + '</div>'; }
function info(msg) { log.innerHTML += '<div class="step" style="color:#c9a84c">→ ' + msg + '</div>'; }

info('Iniciando diagnóstico...');
info('UA: ' + navigator.userAgent.slice(0,80));

// Paso 1: JS básico
try { var x = null ?? 'ok'; ok('Nullish coalescing (??) funciona'); } catch(e) { err('?? NO soportado: ' + e.message); }
try { var obj = {a:{b:1}}; var y = obj?.a?.b; ok('Optional chaining (?.) funciona'); } catch(e) { err('?. NO soportado: ' + e.message); }
try { class A {} ok('Class syntax funciona'); } catch(e) { err('Class NO soportado: ' + e.message); }
try { async function f(){} ok('Async/await funciona'); } catch(e) { err('Async NO soportado: ' + e.message); }
try { localStorage.setItem('t','1'); ok('localStorage funciona'); } catch(e) { err('localStorage BLOQUEADO: ' + e.message); }

// Paso 2: cargar React
info('Cargando React...');
var s1 = document.createElement('script');
s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js';
s1.onload = function() {
  ok('React cargó OK');
  var s2 = document.createElement('script');
  s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js';
  s2.onload = function() {
    ok('ReactDOM cargó OK');
    try {
      var root = document.createElement('div');
      document.body.appendChild(root);
      ReactDOM.createRoot(root).render(React.createElement('span', null, ''));
      ok('ReactDOM.createRoot funciona');
    } catch(e) { err('ReactDOM.createRoot FALLÓ: ' + e.message); }
    info('✅ Todo OK - el problema está en el código de la app');
  };
  s2.onerror = function() { err('ReactDOM NO cargó (problema de red o CDN)'); };
  document.head.appendChild(s2);
};
s1.onerror = function() { err('React NO cargó (problema de red o CDN)'); };
document.head.appendChild(s1);
</script>
</body>
</html>
